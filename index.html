<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weekly Planner">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Weekly Planner</title>
<style>
:root {
  --bg: #fbfcfd; --bg2: #eef2f6; --bg3: #e0e7ef;
  --text: #0f1b2a; --text2: #4a5b6e; --text3: #8a99ab;
  --border: rgba(30,58,90,0.12); --border2: rgba(30,58,90,0.22);
  --accent: #2C6FB0; --green: #1D9E75; --amber: #BA7517; --red: #E24B4A;
  --radius: 12px; --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1822; --bg2: #18242f; --bg3: #22303d;
    --text: #e8eef4; --text2: #9fb0c0; --text3: #5d7186;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.17);
    --accent: #5aa0dc;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; font-size: 16px; }
body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 680px; margin: 0 auto; padding: 0 16px 32px; }

/* Header */
.header { padding: 14px 0 12px; border-bottom: 0.5px solid var(--border); margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.app-title { font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.week-label { font-size: 15px; font-weight: 600; color: var(--text); min-width: 150px; text-align: center; }
.nb { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; color: var(--text2); font-size: 14px; font-family: inherit; }
.nb:active { background: var(--bg3); }
.toggle-wrap { display: flex; border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.tog { font-size: 13px; padding: 6px 16px; background: none; border: none; cursor: pointer; color: var(--text2); font-family: inherit; flex: 1; }
.tog.active { background: var(--bg2); color: var(--text); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg2); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; }
.stat-n { font-size: 20px; font-weight: 600; line-height: 1.2; }
.stat-l { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* Auth banner */
.auth-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; }
.auth-banner.connected { border-color: #6FAEDC; background: #E4EFF8; }
.auth-banner-text { font-size: 13px; color: var(--text2); }
.auth-banner.connected .auth-banner-text { color: #134063; }
.auth-btn { font-size: 13px; padding: 6px 14px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: white; cursor: pointer; font-weight: 600; font-family: inherit; white-space: nowrap; }
.auth-btn.disconnect { background: none; border: 0.5px solid var(--border2); color: var(--text2); }

/* Deadlines */
.section-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.dl-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.dl-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg2); }
.dl-row.warn { background: #FAEEDA; border-color: #EF9F27; }
.dl-row.crit { background: #FCEBEB; border-color: #F09595; }
.dl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dl-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
.dl-row.warn .dl-name { color: #633806; }
.dl-row.crit .dl-name { color: #791F1F; }
.dl-date { font-size: 12px; color: var(--text2); white-space: nowrap; }
.dl-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.dl-badge.crit { background: #F09595; color: #501313; }
.dl-badge.warn { background: #FAC775; color: #412402; }
.dl-badge.ok { background: var(--bg3); color: var(--text2); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text3); padding: 2px; font-size: 18px; line-height: 1; opacity: 0.5; }
.icon-btn:active { opacity: 1; }

/* Inline form */
.inline-form { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 8px; display: none; }
.inline-form.open { display: block; }
.iform-row { display: flex; gap: 8px; margin-bottom: 10px; }
.iform-row input, .iform-row select { font-family: inherit; font-size: 14px; height: 38px; padding: 0 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); flex: 1; }
.iform-btns { display: flex; gap: 8px; }
.btn-primary { font-size: 14px; padding: 8px 18px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: white; cursor: pointer; font-weight: 600; font-family: inherit; }
.btn-secondary { font-size: 14px; padding: 8px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text2); font-family: inherit; }

/* Day/hours grid */
.day-hours-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-bottom: 6px; }
.day-col { display: flex; flex-direction: column; gap: 3px; }
.day-tab { padding: 6px 2px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: none; cursor: pointer; font-size: 11px; color: var(--text2); font-family: inherit; line-height: 1.4; text-align: center; width: 100%; }
.day-tab:active { background: var(--bg2); }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
.hbox { border-radius: var(--radius-sm); padding: 4px 2px; text-align: center; border: 0.5px solid transparent; }
.hbox.green { background: #E1F5EE; border-color: #5DCAA5; }
.hbox.amber { background: #FAEEDA; border-color: #EF9F27; }
.hbox.red { background: #FCEBEB; border-color: #F09595; }
.hbox.none { background: var(--bg2); border-color: var(--border); }
.hbox-n { font-size: 11px; font-weight: 600; line-height: 1.4; }
.hbox.green .hbox-n { color: #085041; }
.hbox.amber .hbox-n { color: #633806; }
.hbox.red .hbox-n { color: #791F1F; }
.hbox.none .hbox-n { color: var(--text3); }
.hbox-l { font-size: 9px; line-height: 1.4; }
.hbox.green .hbox-l { color: #0F6E56; }
.hbox.amber .hbox-l { color: #854F0B; }
.hbox.red .hbox-l { color: #A32D2D; }
.hbox.none .hbox-l { color: var(--text3); }
.week-summary { font-size: 12px; color: var(--text2); padding: 4px 0 12px; }

/* Calendar */
.cal-card { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; }
.cal-ev { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 0.5px solid var(--border); }
.cal-ev:last-child { border-bottom: none; }
.cal-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.cal-time { font-size: 12px; color: var(--text3); min-width: 100px; }
.cal-title { font-size: 13px; }

/* Task cards */
.task-card { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); }
.task-card.urgent-card { border-color: #F09595; }
.task-header { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; }
.task-title-area { flex: 1; min-width: 0; }
.task-name { font-size: 15px; font-weight: 500; line-height: 1.4; }
.task-name.done { text-decoration: line-through; color: var(--text3); }
.task-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.tbadge { font-size: 11px; padding: 2px 7px; border-radius: 4px; line-height: 1.5; }
.size-badge { background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border2); }
.urg-badge { background: #FCEBEB; color: #A32D2D; border: 0.5px solid #F09595; }
.done-badge { background: #E1F5EE; color: #085041; border: 0.5px solid #5DCAA5; }
.task-actions { display: flex; gap: 4px; flex-shrink: 0; }
.task-progress { padding: 0 14px 14px; border-top: 0.5px solid var(--border); }
.progress-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px; }
.progress-label { font-size: 12px; color: var(--text2); }
.log-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text2); font-family: inherit; }
.log-btn:active { background: var(--bg3); }
.hours-input { width: 70px; font-size: 14px; font-family: inherit; height: 34px; padding: 0 8px; text-align: center; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }

/* Category blocks */
.cat-block { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); }
.cat-hdr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; border-bottom: 0.5px solid var(--border); }
.cat-hdr:active { opacity: 0.85; }
.cdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-name-lbl { font-size: 15px; font-weight: 500; flex: 1; }
.cat-meta-lbl { font-size: 12px; color: var(--text2); }

/* Add task form */
.add-form { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
.af-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
.af-input { flex: 1; min-width: 160px; font-size: 14px; font-family: inherit; height: 38px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.af-select { font-size: 14px; font-family: inherit; height: 38px; padding: 0 8px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.af-sublabel { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.urg-label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.urg-label input { accent-color: var(--red); width: 16px; height: 16px; }
.dpick { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; padding: 5px 6px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-family: inherit; background: none; }
.dpick:active { background: var(--bg3); }
.dpick.on { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }

/* Custom select */
.cs-wrap { position: relative; display: inline-block; flex: 1; }
.cs-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 38px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 14px; font-family: inherit; color: var(--text); user-select: none; width: 100%; }
.cs-trigger.open { border-color: var(--accent); }
.cs-label { line-height: 1.6; }
.cs-arrow { font-size: 12px; color: var(--text3); transition: transform 0.15s; }
.cs-trigger.open .cs-arrow { transform: rotate(180deg); }
.cs-dropdown { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); z-index: 100; overflow: hidden; display: none; }
.cs-dropdown.open { display: block; }
.cs-opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: var(--text); cursor: pointer; line-height: 1.6; }
.cs-opt:active { background: var(--bg2); }
.cs-opt.selected { background: var(--bg2); font-weight: 500; }
.cs-opt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.empty-msg { font-size: 14px; color: var(--text3); font-style: italic; padding: 12px 0; }
.st-nm.done { text-decoration: line-through; color: var(--text3); }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Modal / drawer */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal-sheet { background: var(--bg); border-radius: 20px 20px 0 0; width: 100%; max-width: 680px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
.modal-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.modal-title { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.modal-body { overflow-y: auto; flex: 1; padding: 16px; -webkit-overflow-scrolling: touch; }
.modal-section { margin-bottom: 20px; }
.modal-section-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }
.modal-input { width: 100%; font-family: inherit; font-size: 15px; height: 42px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); }
.modal-input:focus { outline: none; border-color: var(--accent); }

/* Subtask rows in modal */
.subtask-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; }
.subtask-done-check { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.subtask-name { flex: 1; font-size: 14px; min-width: 0; }
.subtask-name.done { text-decoration: line-through; color: var(--text3); }
.subtask-hours-summary { font-size: 12px; color: var(--text3); white-space: nowrap; }
.subtask-expand-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text3); padding: 2px 4px; }
.subtask-detail { background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; margin-top: -2px; }

/* Note rows in modal */
.note-row { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; }
.note-meta { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: flex; justify-content: space-between; }
.note-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.note-add-area { width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); resize: none; min-height: 72px; }
.note-add-area:focus { outline: none; border-color: var(--accent); }

/* Day-hours mini editor used in modal subtask detail */
.dh-mini-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dh-mini-label { font-size: 13px; color: var(--text2); min-width: 36px; }
.dh-mini-input { width: 60px; font-size: 13px; font-family: inherit; height: 30px; padding: 0 6px; text-align: center; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.dh-mini-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; opacity: 0.5; padding: 0 2px; }
.dh-add-day-wrap { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

/* Calendar picker */
.cal-picker { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; user-select: none; }
.cal-picker-nav { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-bottom: 0.5px solid var(--border); }
.cal-picker-month { font-size: 12px; font-weight: 600; color: var(--text); }
.cal-picker-nbtn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; padding: 1px 5px; border-radius: var(--radius-sm); font-family: inherit; line-height: 1; }
.cal-picker-nbtn:active { background: var(--bg2); }
.cal-picker-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; padding: 4px; }
.cal-picker-dh { font-size: 9px; font-weight: 600; color: var(--text3); text-align: center; padding: 1px 0 3px; text-transform: uppercase; }
.cal-picker-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 11px; cursor: pointer; color: var(--text); border: none; background: none; font-family: inherit; transition: background 0.1s; }
.cal-picker-day:hover { background: var(--bg2); }
.cal-picker-day.other-month { color: var(--text3); }
.cal-picker-day.today { font-weight: 700; color: var(--accent); }
.cal-picker-day.selected { background: var(--accent); color: white; font-weight: 600; }
.cal-picker-day.selected:hover { background: var(--accent); opacity: 0.9; }
.cal-picker-day.past { opacity: 0.3; cursor: default; }
.slot-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--bg3); border: 0.5px solid var(--border2); color: var(--text2); }
.slot-chip-x { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 0; line-height: 1; margin-left: 2px; }
.recur-badge { background: #E8EFF8; color: #2C6FB0; border: 0.5px solid #A8C4E0; font-size: 11px; padding: 2px 7px; border-radius: 4px; line-height: 1.5; }
@media (prefers-color-scheme: dark) { .recur-badge { background: #1a2d42; color: #5aa0dc; border-color: #2a4a6a; } }
.recur-block { background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); margin-bottom: 10px; overflow: hidden; }
.recur-hdr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; border-bottom: 0.5px solid transparent; }
.recur-hdr.open { border-bottom-color: var(--border); }
.recur-hdr:active { opacity: 0.85; }
.recur-hdr-title { font-size: 14px; font-weight: 500; flex: 1; color: var(--text); }
.recur-hdr-meta { font-size: 12px; color: var(--text3); }
.recur-rule-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }
/* Modal recurrence section */
.recur-field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.recur-field-row label { font-size: 12px; color: var(--text2); white-space: nowrap; min-width: 80px; }
.recur-select { font-family: inherit; font-size: 14px; height: 36px; padding: 0 8px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); flex: 1; }
.recur-date-inp { font-family: inherit; font-size: 14px; height: 36px; padding: 0 8px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); flex: 1; }
.exception-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--text2); border-bottom: 0.5px solid var(--border); }

/* Today banner */
.today-banner { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.today-banner-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.today-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.today-item:last-child { border-bottom: none; padding-bottom: 0; }
.today-item-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.today-item-name { flex: 1; min-width: 0; }
.today-item-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; font-weight: 600; }
.today-tag-urgent { background: #FCEBEB; color: #A32D2D; }
.today-tag-deadline { background: #FAEEDA; color: #633806; }
.today-tag-recur { background: #E8EFF8; color: #2C6FB0; }

/* Search */
.search-wrap { position: relative; margin-bottom: 10px; }

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Replace with your Google OAuth Client ID after creating it in Google Cloud Console
const GOOGLE_CLIENT_ID = '128345576106-t79fkl4nosc9dcn55kfbi36jdi819o5g.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.appdata';
const CAL_API = 'https://www.googleapis.com/calendar/v3';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const SYNC_FILENAME = 'weekly-planner-state.json';

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CATS=[{id:'writing',name:'Writing',color:'#2C6FB0'},{id:'data',name:'Data & analysis',color:'#0E8C6A'},{id:'reading',name:'Reading & lit',color:'#4C5BA6'},{id:'clinical',name:'Clinical & admin',color:'#8A6D3B'},{id:'meetings',name:'Meetings & supervision',color:'#3E8E9E'},{id:'other',name:'Other',color:'#6B7A8D'}];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DL_TYPES={milestone:{color:'#2C6FB0'},abstract:{color:'#0E8C6A'},grant:{color:'#8A6D3B'},paper:{color:'#3E8E9E'}};

// ─── AUTH STATE ──────────────────────────────────────────────────────────────
let accessToken = null;
let tokenExpiry = 0;

function saveToken(token, expiresIn) {
  accessToken = token;
  tokenExpiry = Date.now() + (expiresIn - 60) * 1000; // 1 min buffer
  try {
    localStorage.setItem('gcal-token', JSON.stringify({ token, expiry: tokenExpiry }));
    localStorage.setItem('gcal-connected', '1');
  } catch(e) {}
}

function loadToken() {
  try {
    const s = localStorage.getItem('gcal-token');
    if (!s) return;
    const { token, expiry } = JSON.parse(s);
    if (Date.now() < expiry) { accessToken = token; tokenExpiry = expiry; }
    else { localStorage.removeItem('gcal-token'); }
  } catch(e) {}
}

function clearToken() {
  accessToken = null; tokenExpiry = 0;
  try { localStorage.removeItem('gcal-token'); } catch(e) {}
  calCache = {};
  calFetching.clear();
  driveFileId = null;
}

function isAuthed() { return !!accessToken && Date.now() < tokenExpiry; }

// ─── GOOGLE OAUTH (redirect/implicit flow — token returns in URL hash) ────────
// Reverted from the GIS token-client popup model, which never read the hash and
// left the token stranded in the URL on a blank page. This flow is what worked.
let gisReady = true; // no library init needed; kept for existing call sites

function startAuth() {
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: window.location.origin + window.location.pathname,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true',
    state: 'gcal_auth'
  });
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function handleOAuthRedirect() {
  // Implicit flow returns the token in the URL hash
  const hash = new URLSearchParams(window.location.hash.slice(1));
  if (hash.get('access_token') && hash.get('state') === 'gcal_auth') {
    saveToken(hash.get('access_token'), parseInt(hash.get('expires_in') || '3600'));
    localStorage.setItem('gcal-connected', '1');
    // Clean the token out of the URL/history
    window.history.replaceState({}, document.title, window.location.pathname);
    return true;
  }
  return false;
}

// Kept as no-ops so existing call sites don't need changing.
// (The popup silent-refresh model doesn't apply to the redirect flow; a full
// redirect would be too disruptive to trigger automatically.)
function waitForGis() { renderAuthArea(); }
function silentAuth() {}
function maybeSilentRefresh() {}

// ─── CALENDAR FETCH ──────────────────────────────────────────────────────────
let calCache = {};
const calFetching = new Set();

async function fetchCalendarWeek(mondayStr) {
  if (calCache[mondayStr] || calFetching.has(mondayStr)) return;
  if (!isAuthed()) return;
  calFetching.add(mondayStr);

  const start = new Date(mondayStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(start.getDate() + 7);

  try {
    const url = `${CAL_API}/calendars/primary/events?` + new URLSearchParams({
      timeMin: start.toISOString(),
      timeMax: end.toISOString(),
      singleEvents: 'true',
      orderBy: 'startTime',
      maxResults: '250'
    });
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Calendar API ${res.status}`);
    const data = await res.json();
    const items = data.items || [];

    // Group by weekday
    const calH = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0,Sun:0};
    const calData = {Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[],Sun:[]};
    const dayMap = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Keyword groups:
    //  - CLINICAL: any event matching gets a forced 4h block (all-day or timed)
    //  - MEETING:  use the actual entered duration
    //  Events matching neither are ignored entirely.
    const CLINICAL_RE = /\b(clinic|scope|scopes|ius)\b/i;
    const MEETING_RE = /\bmeeting\b/i;

    const fmt = d => {
      let h = d.getHours(), m = d.getMinutes();
      h = h % 12 || 12;
      return m === 0 ? `${h}` : `${h}:${String(m).padStart(2,'0')}`;
    };

    items.forEach(ev => {
      if (!ev.start) return;

      // Skip events the user has declined
      const declined = (ev.attendees || []).some(a => a.self && a.responseStatus === 'declined');
      if (declined) return;

      const title = ev.summary || '';
      const isClinical = CLINICAL_RE.test(title);
      const isMeeting = MEETING_RE.test(title);

      // Ignore anything that matches neither keyword group.
      if (!isClinical && !isMeeting) return;

      const isAllDay = !!ev.start.date && !ev.start.dateTime;

      // Resolve the start instant and weekday (handles all-day and timed).
      const startDt = isAllDay
        ? new Date(ev.start.date + 'T00:00:00')
        : new Date(ev.start.dateTime);
      const dayName = dayMap[startDt.getDay()];
      if (!calData[dayName]) return;

      // Clinical wins if both keywords are present: forced 4h block.
      if (isClinical) {
        calH[dayName] = Math.round((calH[dayName] + 4) * 100) / 100;
        calData[dayName].push({ time: '4h block', title: title || '(No title)', _start: startDt.getTime() });
        return;
      }

      // Meeting: use the actual entered duration. All-day meetings have no
      // real duration, so skip them rather than guess.
      if (isAllDay) return;
      const endDt = ev.end?.dateTime ? new Date(ev.end.dateTime) : new Date(startDt.getTime() + 3600000);
      const durationH = (endDt - startDt) / 3600000;
      calH[dayName] = Math.round((calH[dayName] + durationH) * 100) / 100;

      const startAmPm = startDt.getHours() < 12 ? 'am' : 'pm';
      const endAmPm = endDt.getHours() < 12 ? 'am' : 'pm';
      const timeStr = startAmPm === endAmPm
        ? `${fmt(startDt)}–${fmt(endDt)}${endAmPm}`
        : `${fmt(startDt)}${startAmPm}–${fmt(endDt)}${endAmPm}`;

      calData[dayName].push({ time: timeStr, title: title || '(No title)', _start: startDt.getTime() });
    });

    // Cache — also persist to localStorage so it survives refresh
    calCache[mondayStr] = { calH, calData };
    try {
      const stored = JSON.parse(localStorage.getItem('calCache') || '{}');
      stored[mondayStr] = { calH, calData, fetchedAt: Date.now() };
      localStorage.setItem('calCache', JSON.stringify(stored));
    } catch(e) {}

  } catch(err) {
    if (err && err.code === 401) { clearToken(); renderAuthArea(); render(); calFetching.delete(mondayStr); return; }
    console.error('Calendar fetch error:', err);
    calCache[mondayStr] = { calH: {}, calData: {} };
  }

  calFetching.delete(mondayStr);
  render();
}

function loadCalCache() {
  // Load previously fetched weeks from localStorage (max 24h old)
  try {
    const stored = JSON.parse(localStorage.getItem('calCache') || '{}');
    const cutoff = Date.now() - 24 * 3600 * 1000;
    Object.entries(stored).forEach(([k, v]) => {
      if (v.fetchedAt > cutoff) calCache[k] = { calH: v.calH, calData: v.calData };
    });
  } catch(e) {}
}

function getCalData(mondayStr) { return calCache[mondayStr] || null; }

// ─── DRIVE APPDATA SYNC ───────────────────────────────────────────────────────
// Two-way sync via one JSON blob in the hidden appDataFolder.
// Merge by id, newer `modified` wins. Deletes are tombstones (deleted:true).
// Subtasks/notes are nested in their parent task, so they ride along with the
// parent's `modified` bump (whole-task last-write-wins, fine for single user).
let driveFileId = null;
let syncing = false;
let pushTimer = null;
let lastSyncAt = 0;

const TOMBSTONE_TTL = 30 * 24 * 3600 * 1000; // prune deletes older than 30d
function pruneTombstones() {
  const cutoff = Date.now() - TOMBSTONE_TTL;
  tasks = tasks.filter(t => !(t.deleted && (t.modified || 0) < cutoff));
  deadlines = deadlines.filter(d => !(d.deleted && (d.modified || 0) < cutoff));
}

function setSyncStatus(state, text) {
  const el = document.getElementById('sync-status');
  if (el) { el.dataset.state = state; el.textContent = text; }
}

async function driveFindFile() {
  if (driveFileId) return driveFileId;
  const url = `${DRIVE_API}/files?` + new URLSearchParams({
    spaces: 'appDataFolder',
    q: `name='${SYNC_FILENAME}'`,
    fields: 'files(id,name,modifiedTime)'
  });
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) throw { code: 401 };
  if (!res.ok) throw new Error(`Drive list ${res.status}`);
  const data = await res.json();
  if (data.files && data.files.length) { driveFileId = data.files[0].id; return driveFileId; }
  return null;
}

async function driveDownload() {
  const id = await driveFindFile();
  if (!id) return null;
  const res = await fetch(`${DRIVE_API}/files/${id}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) throw { code: 401 };
  if (!res.ok) throw new Error(`Drive download ${res.status}`);
  return await res.json();
}

async function driveUpload(payload) {
  const body = JSON.stringify(payload);
  if (driveFileId) {
    const res = await fetch(`${DRIVE_UPLOAD}/files/${driveFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body
    });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Drive update ${res.status}`);
  } else {
    const boundary = 'wp_' + Date.now();
    const meta = { name: SYNC_FILENAME, parents: ['appDataFolder'] };
    const multipart =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(meta) +
      `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
      body +
      `\r\n--${boundary}--`;
    const res = await fetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body: multipart
    });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Drive create ${res.status}`);
    const data = await res.json();
    driveFileId = data.id;
  }
}

function mergeById(local, remote) {
  const map = new Map();
  (local || []).forEach(it => { if (it && it.id != null) map.set(it.id, it); });
  (remote || []).forEach(it => {
    if (!it || it.id == null) return;
    const cur = map.get(it.id);
    if (!cur) { map.set(it.id, it); return; }
    if ((it.modified || 0) > (cur.modified || 0)) map.set(it.id, it);
  });
  return Array.from(map.values());
}

function mergeState(remote) {
  if (!remote) return false;
  let changed = false;
  if (remote.tasks) {
    const before = JSON.stringify(tasks);
    tasks = mergeById(tasks, remote.tasks);
    if (JSON.stringify(tasks) !== before) changed = true;
  }
  if (remote.deadlines) {
    const before = JSON.stringify(deadlines);
    deadlines = mergeById(deadlines, remote.deadlines);
    if (JSON.stringify(deadlines) !== before) changed = true;
  }
  if (remote.collapsed && Object.keys(collapsed).length === 0) collapsed = remote.collapsed;
  return changed;
}

async function syncNow(opts = {}) {
  if (!isAuthed() || syncing) return;
  syncing = true;
  setSyncStatus('syncing', 'Syncing…');
  try {
    const remote = await driveDownload();
    const changed = mergeState(remote);
    pruneTombstones();
    try { localStorage.setItem('weekly-planner', JSON.stringify({tasks,deadlines,collapsed})); } catch(e) {}
    await driveUpload({ tasks, deadlines, collapsed, syncedAt: new Date().toISOString() });
    lastSyncAt = Date.now();
    setSyncStatus('ok', '✓ Synced');
    if (changed && !opts.silent) render();
  } catch (err) {
    if (err && err.code === 401) { clearToken(); renderAuthArea(); render(); }
    else { console.warn('Sync error:', err); setSyncStatus('error', '⚠ Sync failed'); }
  } finally {
    syncing = false;
  }
}

function scheduleSync() {
  if (!isAuthed()) return;
  setSyncStatus('syncing', 'Saving…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { syncNow({ silent: true }); }, 3000);
}


// ─── APP STATE ────────────────────────────────────────────────────────────────
function todayStr(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
let weekOffset=0, view='day', selDay=todayStr(), searchQuery='';
let deadlines=[], tasks=[], collapsed={};
let selSlots=[], selRecurrence=null, addUrgent=false, selCat='writing';
// selSlots: [{week:'2026-06-30', day:'Mon', hours:1}, ...]

function getMonday(off){ const now=new Date(),dow=now.getDay(),m=new Date(now); m.setDate(now.getDate()-(dow===0?6:dow-1)+off*7); m.setHours(0,0,0,0); return m; }
function getMondayStr(off){ const m=getMonday(off); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`; }
function getWeekLabel(off){ const d=getMonday(off),e=new Date(d); e.setDate(d.getDate()+6); const f=dt=>dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); return `${f(d)} – ${f(e)}`; }
function daysUntil(ds){ const now=new Date(); now.setHours(0,0,0,0); const d=new Date(ds); d.setHours(0,0,0,0); return Math.round((d-now)/864e5); }
function hoursColor(h){ if(h===0) return 'none'; if(h<=2) return 'green'; if(h<=4) return 'amber'; return 'red'; }

// ─── SLOT UTILITIES ───────────────────────────────────────────────────────────
function slotsForWeek(task, weekStr){
  return (task.scheduledSlots||[]).filter(s=>s.week===weekStr);
}

function addSlot(tid, week, day){
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  if(!t.scheduledSlots) t.scheduledSlots=[];
  if(!t.scheduledSlots.find(s=>s.week===week&&s.day===day))
    t.scheduledSlots.push({week,day});
  t.modified=Date.now(); save();
}

function removeSlot(tid, week, day){
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  t.scheduledSlots=(t.scheduledSlots||[]).filter(s=>!(s.week===week&&s.day===day));
  t.modified=Date.now(); save();
}

// Subtask slot helpers
function addSubtaskSlot(tid, sid, week, day){
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  const s=t.subtasks&&t.subtasks.find(x=>x.id===sid); if(!s) return;
  if(!s.scheduledSlots) s.scheduledSlots=[];
  if(!s.scheduledSlots.find(x=>x.week===week&&x.day===day))
    s.scheduledSlots.push({week,day});
  t.modified=Date.now(); save();
}

function removeSubtaskSlot(tid, sid, week, day){
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  const s=t.subtasks&&t.subtasks.find(x=>x.id===sid); if(!s) return;
  s.scheduledSlots=(s.scheduledSlots||[]).filter(x=>!(x.week===week&&x.day===day));
  t.modified=Date.now(); save();
}

// ─── RECURRENCE ENGINE ───────────────────────────────────────────────────────
// r = task.recurrence = { type, dayOfWeek, weekOfMonth, dayOfMonth, startDate, endDate?, exceptions:[] }
// types: 'weekly' | 'fortnightly' | 'monthly-date' | 'monthly-day'
const DAYNAME_TO_JS = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0};
const JS_TO_DAYNAME = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function occursOn(task, dateStr) {
  const r = task.recurrence;
  if (!r || !r.type || r.type === 'none') return false;
  const d = new Date(dateStr + 'T00:00:00');
  const start = new Date(r.startDate + 'T00:00:00');
  if (d < start) return false;
  if (r.endDate) { const end = new Date(r.endDate + 'T00:00:00'); if (d > end) return false; }
  if ((r.exceptions||[]).includes(dateStr)) return false;

  if (r.type === 'weekly') {
    return d.getDay() === DAYNAME_TO_JS[r.dayOfWeek];
  }
  if (r.type === 'fortnightly') {
    if (d.getDay() !== DAYNAME_TO_JS[r.dayOfWeek]) return false;
    const diffDays = Math.round((d - start) / 864e5);
    return diffDays % 14 === 0;
  }
  if (r.type === 'monthly-date') {
    return d.getDate() === r.dayOfMonth;
  }
  if (r.type === 'monthly-day') {
    if (d.getDay() !== DAYNAME_TO_JS[r.dayOfWeek]) return false;
    // Which occurrence of this weekday in the month?
    const occurrence = Math.ceil(d.getDate() / 7);
    if (r.weekOfMonth === -1) {
      // Last occurrence: check if adding 7 days goes to next month
      const next = new Date(d); next.setDate(d.getDate() + 7);
      return next.getMonth() !== d.getMonth();
    }
    return occurrence === r.weekOfMonth;
  }
  return false;
}

function recurrenceLabel(r) {
  if (!r || !r.type || r.type === 'none') return '';
  const DAY = r.dayOfWeek || '';
  if (r.type === 'weekly') return `Every ${DAY}`;
  if (r.type === 'fortnightly') return `Every 2 weeks (${DAY})`;
  if (r.type === 'monthly-date') return `Monthly on the ${r.dayOfMonth}${ordinal(r.dayOfMonth)}`;
  if (r.type === 'monthly-day') {
    const wk = r.weekOfMonth === -1 ? 'last' : ['','1st','2nd','3rd','4th'][r.weekOfMonth];
    return `${wk.charAt(0).toUpperCase()+wk.slice(1)} ${DAY} of each month`;
  }
  return '';
}

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v-20)%10]||s[v]||s[0];
}

function skipOccurrence(tid, dateStr) {
  const t = tasks.find(x => x.id === tid); if (!t || !t.recurrence) return;
  if (!t.recurrence.exceptions) t.recurrence.exceptions = [];
  if (!t.recurrence.exceptions.includes(dateStr)) t.recurrence.exceptions.push(dateStr);
  t.modified = Date.now(); save(); render();
}

function setRecurrence(tid, recurrence) {
  const t = tasks.find(x => x.id === tid); if (!t) return;
  t.recurrence = recurrence;
  t.modified = Date.now(); save(); render();
}

// ─── BADGE + TODAY BANNER ────────────────────────────────────────────────────
function getTodayAlerts() {
  const td = todayStr();
  const alerts = [];

  // Urgent tasks scheduled today (slotted or recurring)
  tasks.filter(t=>!t.done&&!t.deleted&&t.urgent).forEach(t=>{
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    const dow=todayD.getDay();
    const diff=dow===0?-6:1-dow;
    const mon=new Date(todayD); mon.setDate(todayD.getDate()+diff);
    const week=`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
    const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dayName=DAY_NAMES[todayD.getDay()];
    const slottedToday=(t.scheduledSlots||[]).some(s=>s.week===week&&s.day===dayName);
    const recurToday=occursOn(t,td);
    if(slottedToday||recurToday) alerts.push({name:t.name,tag:'urgent',cat:t.cat});
  });

  // Non-urgent tasks scheduled today (slotted or recurring) — just for banner, not badge
  tasks.filter(t=>!t.done&&!t.deleted&&!t.urgent).forEach(t=>{
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    const dow=todayD.getDay();
    const diff=dow===0?-6:1-dow;
    const mon=new Date(todayD); mon.setDate(todayD.getDate()+diff);
    const week=`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
    const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dayName=DAY_NAMES[todayD.getDay()];
    const slottedToday=(t.scheduledSlots||[]).some(s=>s.week===week&&s.day===dayName);
    const recurToday=occursOn(t,td);
    if(recurToday) alerts.push({name:t.name,tag:'recur',cat:t.cat});
    else if(slottedToday) alerts.push({name:t.name,tag:'scheduled',cat:t.cat});
  });

  // Deadlines due within 7 days
  deadlines.filter(d=>!d.deleted).forEach(d=>{
    const days=daysUntil(d.date);
    if(days>=0&&days<=7) alerts.push({name:d.name,tag:'deadline',cat:null,days});
  });

  return alerts;
}

function updateBadge() {
  if(!('setAppBadge' in navigator)) return;
  const td=todayStr();
  const todayD=new Date(); todayD.setHours(0,0,0,0);
  const dow=todayD.getDay();
  const diff=dow===0?-6:1-dow;
  const mon=new Date(todayD); mon.setDate(todayD.getDate()+diff);
  const week=`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
  const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayName=DAY_NAMES[todayD.getDay()];

  // Count: urgent tasks scheduled today + recurring tasks today + deadlines ≤7 days
  const urgentToday=tasks.filter(t=>!t.done&&!t.deleted&&t.urgent&&(
    (t.scheduledSlots||[]).some(s=>s.week===week&&s.day===dayName)||occursOn(t,td)
  )).length;
  const recurToday=tasks.filter(t=>!t.done&&!t.deleted&&occursOn(t,td)).length;
  const dlSoon=deadlines.filter(d=>!d.deleted&&daysUntil(d.date)>=0&&daysUntil(d.date)<=7).length;
  const count=urgentToday+recurToday+dlSoon;

  if(count>0) navigator.setAppBadge(count).catch(()=>{});
  else navigator.clearAppBadge().catch(()=>{});
}

function exportData(){
  const payload={tasks,deadlines,collapsed,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`weekly-planner-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let p; try{ p=JSON.parse(reader.result); }catch(e){ alert('Could not read that backup file.'); return; }
    if(!confirm('Replace all current tasks and deadlines with this backup? This cannot be undone.')) return;
    tasks=p.tasks||[]; deadlines=p.deadlines||[]; collapsed=p.collapsed||{};
    // Re-stamp so a restore wins the next sync merge against remote
    const now=Date.now();
    tasks.forEach(t=>t.modified=now); deadlines.forEach(d=>d.modified=now);
    migrateTasks(); save(); render();
  };
  reader.readAsText(file);
}

// ─── CALENDAR PICKER ─────────────────────────────────────────────────────────
// Returns a {el, getSlots, setSlots} object.
// selectedSlots: [{week, day}] — mutated in place via toggle.
// onChange(slots) called whenever selection changes.
function makeCalendarPicker(selectedSlots, onChange) {
  // Working copy so we don't mutate the caller's array directly
  let picked = selectedSlots.map(s=>({...s}));

  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed

  const DAY_LABELS = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  // Convert a Date → the ISO Monday string of its week
  function mondayOfDate(d) {
    const dt = new Date(d); dt.setHours(0,0,0,0);
    const dow = dt.getDay(); // 0=Sun
    const diff = dow === 0 ? -6 : 1 - dow;
    dt.setDate(dt.getDate() + diff);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }

  // day name from 0-based index where 0=Mon (our DAYS array order)
  // Date.getDay() returns 0=Sun,1=Mon,...,6=Sat
  function dayNameFromDate(d) {
    const map = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return map[d.getDay()];
  }

  function isSelected(d) {
    const week = mondayOfDate(d);
    const day = dayNameFromDate(d);
    return picked.some(s => s.week === week && s.day === day);
  }

  function isPast(d) {
    return d < today;
  }

  const wrap = document.createElement('div');

  function buildCalendar() {
    wrap.innerHTML = '';
    wrap.className = 'cal-picker';

    // Nav
    const nav = document.createElement('div'); nav.className = 'cal-picker-nav';
    const prev = document.createElement('button'); prev.className = 'cal-picker-nbtn'; prev.textContent = '‹';
    const monthLbl = document.createElement('span'); monthLbl.className = 'cal-picker-month';
    monthLbl.textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-AU', {month:'long', year:'numeric'});
    const next = document.createElement('button'); next.className = 'cal-picker-nbtn'; next.textContent = '›';
    prev.addEventListener('click', e => { e.stopPropagation(); viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} buildCalendar(); });
    next.addEventListener('click', e => { e.stopPropagation(); viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} buildCalendar(); });
    nav.appendChild(prev); nav.appendChild(monthLbl); nav.appendChild(next);
    wrap.appendChild(nav);

    // Grid
    const grid = document.createElement('div'); grid.className = 'cal-picker-grid';

    // Day headers — Mon first
    DAY_LABELS.forEach(dl => {
      const h = document.createElement('div'); h.className = 'cal-picker-dh'; h.textContent = dl;
      grid.appendChild(h);
    });

    // First day of month, adjusted so Mon=0
    const firstDay = new Date(viewYear, viewMonth, 1);
    const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Mon-based

    // Days in month and previous month padding
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

    // Fill grid: prev month tail + current month + next month head
    const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      const btn = document.createElement('button'); btn.className = 'cal-picker-day';
      let cellDate;

      if (i < startDow) {
        // Prev month
        const d = daysInPrev - startDow + i + 1;
        cellDate = new Date(viewYear, viewMonth - 1, d);
        btn.classList.add('other-month');
      } else if (i >= startDow + daysInMonth) {
        // Next month
        const d = i - startDow - daysInMonth + 1;
        cellDate = new Date(viewYear, viewMonth + 1, d);
        btn.classList.add('other-month');
      } else {
        cellDate = new Date(viewYear, viewMonth, i - startDow + 1);
      }

      btn.textContent = cellDate.getDate();

      const isToday = cellDate.getTime() === today.getTime();
      if (isToday) btn.classList.add('today');

      const past = isPast(cellDate);
      if (past) { btn.classList.add('past'); btn.disabled = true; }

      if (isSelected(cellDate)) btn.classList.add('selected');

      if (!past) {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const week = mondayOfDate(cellDate);
          const day = dayNameFromDate(cellDate);
          const idx = picked.findIndex(s => s.week === week && s.day === day);
          if (idx >= 0) picked.splice(idx, 1);
          else picked.push({week, day});
          onChange(picked);
          // Re-render just the selected states without full rebuild
          wrap.querySelectorAll('.cal-picker-day').forEach(b => b.classList.remove('selected'));
          wrap.querySelectorAll('.cal-picker-day:not(.past):not(.other-month-skip)').forEach(b => {
            // re-check selected — rebuild is simpler
          });
          buildCalendar();
        });
      }

      grid.appendChild(btn);
    }

    wrap.appendChild(grid);
  }

  buildCalendar();

  return {
    el: wrap,
    getSlots: () => picked,
    setSlots: (s) => { picked = s.map(x=>({...x})); buildCalendar(); }
  };
}

function makeCS(options, curVal, onChange) {

  function setVal(val){ const opt=options.find(o=>o.value===val)||options[0]; lbl.textContent=opt.label; dd.querySelectorAll('.cs-opt').forEach(el=>el.className='cs-opt'+(el.dataset.val===val?' selected':'')); }
  options.forEach(opt => {
    const el=document.createElement('div'); el.className='cs-opt'; el.dataset.val=opt.value;
    if(opt.color){ const dot=document.createElement('div'); dot.className='cs-opt-dot'; dot.style.background=opt.color; el.appendChild(dot); }
    el.appendChild(document.createTextNode(opt.label));
    el.addEventListener('click', ()=>{ onChange(opt.value); setVal(opt.value); dd.classList.remove('open'); trig.classList.remove('open'); });

  });
  trig.addEventListener('click', e => {
    e.stopPropagation();

  });
  wrap.appendChild(trig); wrap.appendChild(dd); setVal(curVal);
  return wrap;
}

function addTask() {
  const inp=document.getElementById('t-name'), text=inp.value.trim();
  if(!text) return;
  tasks.push({id:Date.now()+Math.floor(Math.random()*9999),name:text,cat:selCat,scheduledSlots:selSlots.map(s=>({week:s.week,day:s.day})),recurrence:selRecurrence||undefined,urgent:addUrgent,done:false,modified:Date.now()});
  inp.value=''; addUrgent=false; selSlots=[]; selRecurrence=null;
  document.getElementById('t-urgent').checked=false;
  save(); render();
}
// Migrate legacy tasks:
//   days[] → dayHours{} → scheduledSlots[]
// dayHours entries are stamped to the current week's Monday (best guess).
function migrateTasks(){
  const thisWeek=getMondayStr(0);
  tasks.forEach(t=>{
    // Step 1: days[] → dayHours{}
    if(!t.dayHours && t.days){ t.dayHours={}; (t.days||[]).forEach(d=>{ t.dayHours[d]=1; }); delete t.days; }
    // Step 2: dayHours{} → scheduledSlots[]
    if(t.dayHours && !t.scheduledSlots){
      t.scheduledSlots=[];
      Object.entries(t.dayHours).forEach(([day,hours])=>{
        if(hours>0) t.scheduledSlots.push({week:thisWeek,day});
      });
      delete t.dayHours;
    }
    if(!t.scheduledSlots) t.scheduledSlots=[];
    // Migrate subtask dayHours too
    (t.subtasks||[]).forEach(s=>{
      if(s.dayHours && !s.scheduledSlots){
        s.scheduledSlots=[];
        Object.entries(s.dayHours).forEach(([day,hours])=>{
          if(hours>0) s.scheduledSlots.push({week:thisWeek,day});
        });
        delete s.dayHours;
      }
      if(!s.scheduledSlots) s.scheduledSlots=[];
    });
    if(!t.modified) t.modified=t.doneAt||t.id||Date.now();
  });
  deadlines.forEach(d=>{ if(!d.modified) d.modified=d.id||Date.now(); });
}

function sortedByCat(arr) {
  // Manual order first (tasks with .order set), then urgent, then creation
  return arr.sort((a,b)=>{
    const aHasOrder = a.order!=null, bHasOrder = b.order!=null;
    if(aHasOrder && bHasOrder) return a.order-b.order;
    if(aHasOrder) return -1;
    if(bHasOrder) return 1;
    return (b.urgent?1:0)-(a.urgent?1:0);
  });
}

function reorderTask(catId, fromIdx, toIdx) {
  const catTasks = tasks.filter(t=>t.cat===catId&&!t.deleted&&!t.done&&!(t.recurrence&&t.recurrence.type&&t.recurrence.type!=='none'));
  sortedByCat(catTasks);
  if(fromIdx===toIdx||fromIdx<0||toIdx<0||fromIdx>=catTasks.length||toIdx>=catTasks.length) return;
  const moved = catTasks.splice(fromIdx, 1)[0];
  catTasks.splice(toIdx, 0, moved);
  catTasks.forEach((t,i) => { t.order=i; t.modified=Date.now(); });
  save(); render();
}

// ─── SUBTASK HELPERS ──────────────────────────────────────────────────────────
// Subtasks/notes are nested in the parent task, so they sync as part of it:
// every mutation bumps the parent task's `modified`.
function addSubtask(tid, name) {
  const t=tasks.find(x=>x.id===tid); if(!t||!name.trim()) return;
  if(!t.subtasks) t.subtasks=[];
  t.subtasks.push({id:Date.now()+Math.floor(Math.random()*9999),name:name.trim(),scheduledSlots:[],urgent:false,done:false});
  t.modified=Date.now(); save();
}
function updateSubtask(tid, sid, patch) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  const s=t.subtasks&&t.subtasks.find(x=>x.id===sid); if(!s) return;
  Object.assign(s, patch); t.modified=Date.now(); save();
}
function deleteSubtask(tid, sid) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  t.subtasks=(t.subtasks||[]).filter(x=>x.id!==sid); t.modified=Date.now(); save();
}


// ─── NOTE HELPERS ─────────────────────────────────────────────────────────────
function addNote(tid, text) {
  const t=tasks.find(x=>x.id===tid); if(!t||!text.trim()) return;
  if(!t.notes) t.notes=[];
  t.notes.push({id:Date.now(),text:text.trim(),createdAt:Date.now()});
  t.modified=Date.now(); save();
}
function deleteNote(tid, nid) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  t.notes=(t.notes||[]).filter(x=>x.id!==nid); t.modified=Date.now(); save();
}
