<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weekly Planner">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Weekly Planner</title>
<style>
:root {
  --bg: #fbfcfd; --bg2: #eef2f6; --bg3: #e0e7ef;
  --text: #0f1b2a; --text2: #4a5b6e; --text3: #8a99ab;
  --border: rgba(30,58,90,0.12); --border2: rgba(30,58,90,0.22);
  --accent: #2C6FB0; --green: #1D9E75; --amber: #BA7517; --red: #E24B4A;
  --radius: 12px; --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1822; --bg2: #18242f; --bg3: #22303d;
    --text: #e8eef4; --text2: #9fb0c0; --text3: #5d7186;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.17);
    --accent: #5aa0dc;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; font-size: 16px; }
body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 680px; margin: 0 auto; padding: 0 16px 32px; }

/* Header */
.header { padding: 14px 0 12px; border-bottom: 0.5px solid var(--border); margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.app-title { font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.week-label { font-size: 15px; font-weight: 600; color: var(--text); min-width: 150px; text-align: center; }
.nb { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; color: var(--text2); font-size: 14px; font-family: inherit; }
.nb:active { background: var(--bg3); }
.toggle-wrap { display: flex; border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.tog { font-size: 13px; padding: 6px 16px; background: none; border: none; cursor: pointer; color: var(--text2); font-family: inherit; flex: 1; }
.tog.active { background: var(--bg2); color: var(--text); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg2); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; }
.stat-n { font-size: 20px; font-weight: 600; line-height: 1.2; }
.stat-l { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* Auth banner */
.auth-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; }
.auth-banner.connected { border-color: #6FAEDC; background: #E4EFF8; }
.auth-banner-text { font-size: 13px; color: var(--text2); }
.auth-banner.connected .auth-banner-text { color: #134063; }
.auth-btn { font-size: 13px; padding: 6px 14px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: white; cursor: pointer; font-weight: 600; font-family: inherit; white-space: nowrap; }
.auth-btn.disconnect { background: none; border: 0.5px solid var(--border2); color: var(--text2); }

/* Deadlines */
.section-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.dl-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.dl-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg2); }
.dl-row.warn { background: #FAEEDA; border-color: #EF9F27; }
.dl-row.crit { background: #FCEBEB; border-color: #F09595; }
.dl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dl-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
.dl-row.warn .dl-name { color: #633806; }
.dl-row.crit .dl-name { color: #791F1F; }
.dl-date { font-size: 12px; color: var(--text2); white-space: nowrap; }
.dl-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.dl-badge.crit { background: #F09595; color: #501313; }
.dl-badge.warn { background: #FAC775; color: #412402; }
.dl-badge.ok { background: var(--bg3); color: var(--text2); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text3); padding: 2px; font-size: 18px; line-height: 1; opacity: 0.5; }
.icon-btn:active { opacity: 1; }

/* Inline form */
.inline-form { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 8px; display: none; }
.inline-form.open { display: block; }
.iform-row { display: flex; gap: 8px; margin-bottom: 10px; }
.iform-row input, .iform-row select { font-family: inherit; font-size: 14px; height: 38px; padding: 0 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); flex: 1; }
.iform-btns { display: flex; gap: 8px; }
.btn-primary { font-size: 14px; padding: 8px 18px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: white; cursor: pointer; font-weight: 600; font-family: inherit; }
.btn-secondary { font-size: 14px; padding: 8px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text2); font-family: inherit; }

/* Day/hours grid */
.day-hours-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-bottom: 6px; }
.day-col { display: flex; flex-direction: column; gap: 3px; }
.day-tab { padding: 6px 2px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: none; cursor: pointer; font-size: 11px; color: var(--text2); font-family: inherit; line-height: 1.4; text-align: center; width: 100%; }
.day-tab:active { background: var(--bg2); }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
.hbox { border-radius: var(--radius-sm); padding: 4px 2px; text-align: center; border: 0.5px solid transparent; }
.hbox.green { background: #E1F5EE; border-color: #5DCAA5; }
.hbox.amber { background: #FAEEDA; border-color: #EF9F27; }
.hbox.red { background: #FCEBEB; border-color: #F09595; }
.hbox.none { background: var(--bg2); border-color: var(--border); }
.hbox-n { font-size: 11px; font-weight: 600; line-height: 1.4; }
.hbox.green .hbox-n { color: #085041; }
.hbox.amber .hbox-n { color: #633806; }
.hbox.red .hbox-n { color: #791F1F; }
.hbox.none .hbox-n { color: var(--text3); }
.hbox-l { font-size: 9px; line-height: 1.4; }
.hbox.green .hbox-l { color: #0F6E56; }
.hbox.amber .hbox-l { color: #854F0B; }
.hbox.red .hbox-l { color: #A32D2D; }
.hbox.none .hbox-l { color: var(--text3); }
.week-summary { font-size: 12px; color: var(--text2); padding: 4px 0 12px; }

/* Calendar */
.cal-card { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; }
.cal-ev { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 0.5px solid var(--border); }
.cal-ev:last-child { border-bottom: none; }
.cal-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.cal-time { font-size: 12px; color: var(--text3); min-width: 100px; }
.cal-title { font-size: 13px; }

/* Task cards */
.task-card { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); }
.task-card.urgent-card { border-color: #F09595; }
.task-header { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; }
.task-title-area { flex: 1; min-width: 0; }
.task-name { font-size: 15px; font-weight: 500; line-height: 1.4; }
.task-name.done { text-decoration: line-through; color: var(--text3); }
.task-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.tbadge { font-size: 11px; padding: 2px 7px; border-radius: 4px; line-height: 1.5; }
.size-badge { background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border2); }
.urg-badge { background: #FCEBEB; color: #A32D2D; border: 0.5px solid #F09595; }
.done-badge { background: #E1F5EE; color: #085041; border: 0.5px solid #5DCAA5; }
.task-actions { display: flex; gap: 4px; flex-shrink: 0; }
.task-progress { padding: 0 14px 14px; border-top: 0.5px solid var(--border); }
.progress-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px; }
.progress-label { font-size: 12px; color: var(--text2); }
.log-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text2); font-family: inherit; }
.log-btn:active { background: var(--bg3); }
.hours-input { width: 70px; font-size: 14px; font-family: inherit; height: 34px; padding: 0 8px; text-align: center; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }

/* Category blocks */
.cat-block { background: var(--bg2); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); }
.cat-hdr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; border-bottom: 0.5px solid var(--border); }
.cat-hdr:active { opacity: 0.85; }
.cdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-name-lbl { font-size: 15px; font-weight: 500; flex: 1; }
.cat-meta-lbl { font-size: 12px; color: var(--text2); }

/* Add task form */
.add-form { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
.af-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
.af-input { flex: 1; min-width: 160px; font-size: 14px; font-family: inherit; height: 38px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.af-select { font-size: 14px; font-family: inherit; height: 38px; padding: 0 8px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.af-sublabel { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.urg-label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.urg-label input { accent-color: var(--red); width: 16px; height: 16px; }
.dpick { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; padding: 5px 6px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-family: inherit; background: none; }
.dpick:active { background: var(--bg3); }
.dpick.on { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }

/* Custom select */
.cs-wrap { position: relative; display: inline-block; flex: 1; }
.cs-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 38px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 14px; font-family: inherit; color: var(--text); user-select: none; width: 100%; }
.cs-trigger.open { border-color: var(--accent); }
.cs-label { line-height: 1.6; }
.cs-arrow { font-size: 12px; color: var(--text3); transition: transform 0.15s; }
.cs-trigger.open .cs-arrow { transform: rotate(180deg); }
.cs-dropdown { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); z-index: 100; overflow: hidden; display: none; }
.cs-dropdown.open { display: block; }
.cs-opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: var(--text); cursor: pointer; line-height: 1.6; }
.cs-opt:active { background: var(--bg2); }
.cs-opt.selected { background: var(--bg2); font-weight: 500; }
.cs-opt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.empty-msg { font-size: 14px; color: var(--text3); font-style: italic; padding: 12px 0; }
.st-nm.done { text-decoration: line-through; color: var(--text3); }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Modal / drawer */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal-sheet { background: var(--bg); border-radius: 20px 20px 0 0; width: 100%; max-width: 680px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
.modal-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.modal-title { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.modal-body { overflow-y: auto; flex: 1; padding: 16px; -webkit-overflow-scrolling: touch; }
.modal-section { margin-bottom: 20px; }
.modal-section-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }
.modal-input { width: 100%; font-family: inherit; font-size: 15px; height: 42px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); }
.modal-input:focus { outline: none; border-color: var(--accent); }

/* Subtask rows in modal */
.subtask-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; }
.subtask-done-check { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.subtask-name { flex: 1; font-size: 14px; min-width: 0; }
.subtask-name.done { text-decoration: line-through; color: var(--text3); }
.subtask-hours-summary { font-size: 12px; color: var(--text3); white-space: nowrap; }
.subtask-expand-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text3); padding: 2px 4px; }
.subtask-detail { background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; margin-top: -2px; }

/* Note rows in modal */
.note-row { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; }
.note-meta { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: flex; justify-content: space-between; }
.note-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.note-add-area { width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text); resize: none; min-height: 72px; }
.note-add-area:focus { outline: none; border-color: var(--accent); }

/* Day-hours mini editor used in modal subtask detail */
.dh-mini-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dh-mini-label { font-size: 13px; color: var(--text2); min-width: 36px; }
.dh-mini-input { width: 60px; font-size: 13px; font-family: inherit; height: 30px; padding: 0 6px; text-align: center; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); }
.dh-mini-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; opacity: 0.5; padding: 0 2px; }
.dh-add-day-wrap { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
</style>

<div class="app">
  <div class="header">

      <span class="app-title">Weekly Planner</span>
      <button class="nb" id="todaybtn">This week</button>
    </div>
    <div class="week-nav">
      <button class="nb" id="prev">&#8249;</button>
      <span class="week-label" id="wlabel"></span>
      <button class="nb" id="next">&#8250;</button>
    </div>
    <div class="toggle-wrap">
      <button class="tog active" id="tog-day">&#128197; Day</button>
      <button class="tog" id="tog-tasks">&#9776; All tasks</button>
      <button class="tog" id="tog-archive">&#10003; Archive</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="auth-area"></div>
  <div id="main"></div>
</div>
<div class="modal-overlay hidden" id="task-modal"></div>
<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Replace with your Google OAuth Client ID after creating it in Google Cloud Console
const GOOGLE_CLIENT_ID = '128345576106-t79fkl4nosc9dcn55kfbi36jdi819o5g.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.appdata';
const CAL_API = 'https://www.googleapis.com/calendar/v3';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const SYNC_FILENAME = 'weekly-planner-state.json';

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CATS=[{id:'writing',name:'Writing',color:'#2C6FB0'},{id:'data',name:'Data & analysis',color:'#0E8C6A'},{id:'reading',name:'Reading & lit',color:'#4C5BA6'},{id:'clinical',name:'Clinical & admin',color:'#8A6D3B'},{id:'meetings',name:'Meetings & supervision',color:'#3E8E9E'},{id:'other',name:'Other',color:'#6B7A8D'}];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DL_TYPES={milestone:{color:'#2C6FB0'},abstract:{color:'#0E8C6A'},grant:{color:'#8A6D3B'},paper:{color:'#3E8E9E'}};

// ─── AUTH STATE ──────────────────────────────────────────────────────────────
let accessToken = null;
let tokenExpiry = 0;

function saveToken(token, expiresIn) {
  accessToken = token;
  tokenExpiry = Date.now() + (expiresIn - 60) * 1000; // 1 min buffer
  try {
    localStorage.setItem('gcal-token', JSON.stringify({ token, expiry: tokenExpiry }));
    localStorage.setItem('gcal-connected', '1');
  } catch(e) {}
}

function loadToken() {
  try {
    const s = localStorage.getItem('gcal-token');
    if (!s) return;
    const { token, expiry } = JSON.parse(s);
    if (Date.now() < expiry) { accessToken = token; tokenExpiry = expiry; }
    else { localStorage.removeItem('gcal-token'); }
  } catch(e) {}
}

function clearToken() {
  accessToken = null; tokenExpiry = 0;
  try { localStorage.removeItem('gcal-token'); } catch(e) {}
  calCache = {};
  calFetching.clear();
  driveFileId = null;
}

function isAuthed() { return !!accessToken && Date.now() < tokenExpiry; }

// ─── GOOGLE OAUTH (redirect/implicit flow — token returns in URL hash) ────────
// Reverted from the GIS token-client popup model, which never read the hash and
// left the token stranded in the URL on a blank page. This flow is what worked.
let gisReady = true; // no library init needed; kept for existing call sites

function startAuth() {
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: window.location.origin + window.location.pathname,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true',
    state: 'gcal_auth'
  });
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function handleOAuthRedirect() {
  // Implicit flow returns the token in the URL hash
  const hash = new URLSearchParams(window.location.hash.slice(1));
  if (hash.get('access_token') && hash.get('state') === 'gcal_auth') {
    saveToken(hash.get('access_token'), parseInt(hash.get('expires_in') || '3600'));
    localStorage.setItem('gcal-connected', '1');
    // Clean the token out of the URL/history
    window.history.replaceState({}, document.title, window.location.pathname);
    return true;
  }
  return false;
}

// Kept as no-ops so existing call sites don't need changing.
// (The popup silent-refresh model doesn't apply to the redirect flow; a full
// redirect would be too disruptive to trigger automatically.)
function waitForGis() { renderAuthArea(); }
function silentAuth() {}
function maybeSilentRefresh() {}

// ─── CALENDAR FETCH ──────────────────────────────────────────────────────────
let calCache = {};
const calFetching = new Set();

async function fetchCalendarWeek(mondayStr) {
  if (calCache[mondayStr] || calFetching.has(mondayStr)) return;
  if (!isAuthed()) return;
  calFetching.add(mondayStr);

  const start = new Date(mondayStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(start.getDate() + 7);

  try {
    const url = `${CAL_API}/calendars/primary/events?` + new URLSearchParams({
      timeMin: start.toISOString(),
      timeMax: end.toISOString(),
      singleEvents: 'true',
      orderBy: 'startTime',
      maxResults: '250'
    });
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Calendar API ${res.status}`);
    const data = await res.json();
    const items = data.items || [];

    // Group by weekday
    const calH = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0,Sun:0};
    const calData = {Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[],Sun:[]};
    const dayMap = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Keyword groups:
    //  - CLINICAL: any event matching gets a forced 4h block (all-day or timed)
    //  - MEETING:  use the actual entered duration
    //  Events matching neither are ignored entirely.
    const CLINICAL_RE = /\b(clinic|scope|scopes|ius)\b/i;
    const MEETING_RE = /\bmeeting\b/i;

    const fmt = d => {
      let h = d.getHours(), m = d.getMinutes();
      h = h % 12 || 12;
      return m === 0 ? `${h}` : `${h}:${String(m).padStart(2,'0')}`;
    };

    items.forEach(ev => {
      if (!ev.start) return;

      // Skip events the user has declined
      const declined = (ev.attendees || []).some(a => a.self && a.responseStatus === 'declined');
      if (declined) return;

      const title = ev.summary || '';
      const isClinical = CLINICAL_RE.test(title);
      const isMeeting = MEETING_RE.test(title);

      // Ignore anything that matches neither keyword group.
      if (!isClinical && !isMeeting) return;

      const isAllDay = !!ev.start.date && !ev.start.dateTime;

      // Resolve the start instant and weekday (handles all-day and timed).
      const startDt = isAllDay
        ? new Date(ev.start.date + 'T00:00:00')
        : new Date(ev.start.dateTime);
      const dayName = dayMap[startDt.getDay()];
      if (!calData[dayName]) return;

      // Clinical wins if both keywords are present: forced 4h block.
      if (isClinical) {
        calH[dayName] = Math.round((calH[dayName] + 4) * 100) / 100;
        calData[dayName].push({ time: '4h block', title: title || '(No title)', _start: startDt.getTime() });
        return;
      }

      // Meeting: use the actual entered duration. All-day meetings have no
      // real duration, so skip them rather than guess.
      if (isAllDay) return;
      const endDt = ev.end?.dateTime ? new Date(ev.end.dateTime) : new Date(startDt.getTime() + 3600000);
      const durationH = (endDt - startDt) / 3600000;
      calH[dayName] = Math.round((calH[dayName] + durationH) * 100) / 100;

      const startAmPm = startDt.getHours() < 12 ? 'am' : 'pm';
      const endAmPm = endDt.getHours() < 12 ? 'am' : 'pm';
      const timeStr = startAmPm === endAmPm
        ? `${fmt(startDt)}–${fmt(endDt)}${endAmPm}`
        : `${fmt(startDt)}${startAmPm}–${fmt(endDt)}${endAmPm}`;

      calData[dayName].push({ time: timeStr, title: title || '(No title)', _start: startDt.getTime() });
    });

    // Cache — also persist to localStorage so it survives refresh
    calCache[mondayStr] = { calH, calData };
    try {
      const stored = JSON.parse(localStorage.getItem('calCache') || '{}');
      stored[mondayStr] = { calH, calData, fetchedAt: Date.now() };
      localStorage.setItem('calCache', JSON.stringify(stored));
    } catch(e) {}

  } catch(err) {
    if (err && err.code === 401) { clearToken(); renderAuthArea(); render(); calFetching.delete(mondayStr); return; }
    console.error('Calendar fetch error:', err);
    calCache[mondayStr] = { calH: {}, calData: {} };
  }

  calFetching.delete(mondayStr);
  render();
}

function loadCalCache() {
  // Load previously fetched weeks from localStorage (max 24h old)
  try {
    const stored = JSON.parse(localStorage.getItem('calCache') || '{}');
    const cutoff = Date.now() - 24 * 3600 * 1000;
    Object.entries(stored).forEach(([k, v]) => {
      if (v.fetchedAt > cutoff) calCache[k] = { calH: v.calH, calData: v.calData };
    });
  } catch(e) {}
}

function getCalData(mondayStr) { return calCache[mondayStr] || null; }

// ─── DRIVE APPDATA SYNC ───────────────────────────────────────────────────────
// Two-way sync via one JSON blob in the hidden appDataFolder.
// Merge by id, newer `modified` wins. Deletes are tombstones (deleted:true).
// Subtasks/notes are nested in their parent task, so they ride along with the
// parent's `modified` bump (whole-task last-write-wins, fine for single user).
let driveFileId = null;
let syncing = false;
let pushTimer = null;
let lastSyncAt = 0;

const TOMBSTONE_TTL = 30 * 24 * 3600 * 1000; // prune deletes older than 30d
function pruneTombstones() {
  const cutoff = Date.now() - TOMBSTONE_TTL;
  tasks = tasks.filter(t => !(t.deleted && (t.modified || 0) < cutoff));
  deadlines = deadlines.filter(d => !(d.deleted && (d.modified || 0) < cutoff));
}

function setSyncStatus(state, text) {
  const el = document.getElementById('sync-status');
  if (el) { el.dataset.state = state; el.textContent = text; }
}

async function driveFindFile() {
  if (driveFileId) return driveFileId;
  const url = `${DRIVE_API}/files?` + new URLSearchParams({
    spaces: 'appDataFolder',
    q: `name='${SYNC_FILENAME}'`,
    fields: 'files(id,name,modifiedTime)'
  });
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) throw { code: 401 };
  if (!res.ok) throw new Error(`Drive list ${res.status}`);
  const data = await res.json();
  if (data.files && data.files.length) { driveFileId = data.files[0].id; return driveFileId; }
  return null;
}

async function driveDownload() {
  const id = await driveFindFile();
  if (!id) return null;
  const res = await fetch(`${DRIVE_API}/files/${id}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) throw { code: 401 };
  if (!res.ok) throw new Error(`Drive download ${res.status}`);
  return await res.json();
}

async function driveUpload(payload) {
  const body = JSON.stringify(payload);
  if (driveFileId) {
    const res = await fetch(`${DRIVE_UPLOAD}/files/${driveFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body
    });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Drive update ${res.status}`);
  } else {
    const boundary = 'wp_' + Date.now();
    const meta = { name: SYNC_FILENAME, parents: ['appDataFolder'] };
    const multipart =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(meta) +
      `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
      body +
      `\r\n--${boundary}--`;
    const res = await fetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body: multipart
    });
    if (res.status === 401) throw { code: 401 };
    if (!res.ok) throw new Error(`Drive create ${res.status}`);
    const data = await res.json();
    driveFileId = data.id;
  }
}

function mergeById(local, remote) {
  const map = new Map();
  (local || []).forEach(it => { if (it && it.id != null) map.set(it.id, it); });
  (remote || []).forEach(it => {
    if (!it || it.id == null) return;
    const cur = map.get(it.id);
    if (!cur) { map.set(it.id, it); return; }
    if ((it.modified || 0) > (cur.modified || 0)) map.set(it.id, it);
  });
  return Array.from(map.values());
}

function mergeState(remote) {
  if (!remote) return false;
  let changed = false;
  if (remote.tasks) {
    const before = JSON.stringify(tasks);
    tasks = mergeById(tasks, remote.tasks);
    if (JSON.stringify(tasks) !== before) changed = true;
  }
  if (remote.deadlines) {
    const before = JSON.stringify(deadlines);
    deadlines = mergeById(deadlines, remote.deadlines);
    if (JSON.stringify(deadlines) !== before) changed = true;
  }
  if (remote.collapsed && Object.keys(collapsed).length === 0) collapsed = remote.collapsed;
  return changed;
}

async function syncNow(opts = {}) {
  if (!isAuthed() || syncing) return;
  syncing = true;
  setSyncStatus('syncing', 'Syncing…');
  try {
    const remote = await driveDownload();
    const changed = mergeState(remote);
    pruneTombstones();
    try { localStorage.setItem('weekly-planner', JSON.stringify({tasks,deadlines,collapsed})); } catch(e) {}
    await driveUpload({ tasks, deadlines, collapsed, syncedAt: new Date().toISOString() });
    lastSyncAt = Date.now();
    setSyncStatus('ok', '✓ Synced');
    if (changed && !opts.silent) render();
  } catch (err) {
    if (err && err.code === 401) { clearToken(); renderAuthArea(); render(); }
    else { console.warn('Sync error:', err); setSyncStatus('error', '⚠ Sync failed'); }
  } finally {
    syncing = false;
  }
}

function scheduleSync() {
  if (!isAuthed()) return;
  setSyncStatus('syncing', 'Saving…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { syncNow({ silent: true }); }, 3000);
}

function getMonday(off){ const now=new Date(),dow=now.getDay(),m=new Date(now); m.setDate(now.getDate()-(dow===0?6:dow-1)+off*7); m.setHours(0,0,0,0); return m; }
function getMondayStr(off){ const m=getMonday(off); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`; }
function getWeekLabel(off){ const d=getMonday(off),e=new Date(d); e.setDate(d.getDate()+6); const f=dt=>dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); return `${f(d)} – ${f(e)}`; }
function daysUntil(ds){ const now=new Date(); now.setHours(0,0,0,0); const d=new Date(ds); d.setHours(0,0,0,0); return Math.round((d-now)/864e5); }
function hoursColor(h){ if(h===0) return 'none'; if(h<=2) return 'green'; if(h<=4) return 'amber'; return 'red'; }

function save(){ try{ localStorage.setItem('weekly-planner', JSON.stringify({tasks,deadlines,collapsed})); }catch(e){} scheduleSync(); }
function load(){
  try{
    const s=localStorage.getItem('weekly-planner');
    if(s){ const p=JSON.parse(s); tasks=p.tasks||[]; deadlines=p.deadlines||[]; collapsed=p.collapsed||{}; }
  }catch(e){}
}

// ─── BACKUP / RESTORE ─────────────────────────────────────────────────────────
function exportData(){
  const payload={tasks,deadlines,collapsed,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`weekly-planner-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let p; try{ p=JSON.parse(reader.result); }catch(e){ alert('Could not read that backup file.'); return; }
    if(!confirm('Replace all current tasks and deadlines with this backup? This cannot be undone.')) return;
    tasks=p.tasks||[]; deadlines=p.deadlines||[]; collapsed=p.collapsed||{};
    // Re-stamp so a restore wins the next sync merge against remote
    const now=Date.now();
    tasks.forEach(t=>t.modified=now); deadlines.forEach(d=>d.modified=now);
    migrateTasks(); save(); render();
  };
  reader.readAsText(file);
}

// ─── CUSTOM SELECT ────────────────────────────────────────────────────────────
function makeCS(options, curVal, onChange) {
  const wrap=document.createElement('div'); wrap.className='cs-wrap';
  const trig=document.createElement('div'); trig.className='cs-trigger';
  const lbl=document.createElement('span'); lbl.className='cs-label';
  const arr=document.createElement('span'); arr.className='cs-arrow'; arr.textContent='▾';
  trig.appendChild(lbl); trig.appendChild(arr);
  const dd=document.createElement('div'); dd.className='cs-dropdown';
  function setVal(val){ const opt=options.find(o=>o.value===val)||options[0]; lbl.textContent=opt.label; dd.querySelectorAll('.cs-opt').forEach(el=>el.className='cs-opt'+(el.dataset.val===val?' selected':'')); }
  options.forEach(opt => {
    const el=document.createElement('div'); el.className='cs-opt'; el.dataset.val=opt.value;
    if(opt.color){ const dot=document.createElement('div'); dot.className='cs-opt-dot'; dot.style.background=opt.color; el.appendChild(dot); }
    el.appendChild(document.createTextNode(opt.label));
    el.addEventListener('click', ()=>{ onChange(opt.value); setVal(opt.value); dd.classList.remove('open'); trig.classList.remove('open'); });
    dd.appendChild(el);
  });
  trig.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen=dd.classList.contains('open');
    document.querySelectorAll('.cs-dropdown').forEach(d=>d.classList.remove('open'));
    document.querySelectorAll('.cs-trigger').forEach(t=>t.classList.remove('open'));
    if(!isOpen){ dd.classList.add('open'); trig.classList.add('open'); }
  });
  wrap.appendChild(trig); wrap.appendChild(dd); setVal(curVal);
  return wrap;
}

      const del=document.createElement('button'); del.className='icon-btn'; del.textContent='×';

  row2.appendChild(typeSelect);

  const saveBtn=document.createElement('button'); saveBtn.className='btn-primary'; saveBtn.textContent='Save';
  const cancelBtn=document.createElement('button'); cancelBtn.className='btn-secondary'; cancelBtn.textContent='Cancel';
  btns.appendChild(saveBtn); btns.appendChild(cancelBtn);
  form.appendChild(row1); form.appendChild(row2); form.appendChild(btns);
  container.appendChild(form);

  addBtn.addEventListener('click',()=>form.classList.toggle('open'));
  cancelBtn.addEventListener('click',()=>{ form.classList.remove('open'); nameInp.value=''; dateInp.value=''; });
  saveBtn.addEventListener('click',()=>{
    const name=nameInp.value.trim(), date=dateInp.value, type=typeSelect.value;
    if(!name||!date){ if(!name) nameInp.focus(); else dateInp.focus(); return; }

// Migrate legacy tasks that have days[] but no dayHours; stamp modified for sync
function migrateTasks(){
  tasks.forEach(t=>{
    if(!t.dayHours){ t.dayHours={}; (t.days||[]).forEach(d=>{ t.dayHours[d]=1; }); delete t.days; }
    if(!t.modified) t.modified=t.doneAt||t.id||Date.now();
  });
  deadlines.forEach(d=>{ if(!d.modified) d.modified=d.id||Date.now(); });
}
function markDone(tid){ const t=tasks.find(x=>x.id===tid); if(t){ t.done=!t.done; t.doneAt=t.done?Date.now():null; t.modified=Date.now(); save(); render(); } }
function toggleUrgent(tid){ const t=tasks.find(x=>x.id===tid); if(t){ t.urgent=!t.urgent; t.modified=Date.now(); save(); render(); } }
function deleteTask(tid){ const t=tasks.find(x=>x.id===tid); if(t){ t.deleted=true; t.modified=Date.now(); } save(); render(); }
function rolloverTask(tid, fromDay, toDay, hours) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  if(!t.dayHours) t.dayHours={};
  delete t.dayHours[fromDay];
  t.dayHours[toDay]=(t.dayHours[toDay]||0)+hours;
  t.modified=Date.now();
  save(); render();
}
function updateDayHours(tid, day, hours) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  if(!t.dayHours) t.dayHours={};
  if(hours<=0) delete t.dayHours[day]; else t.dayHours[day]=hours;
  t.modified=Date.now();
  save(); render();
}
function setView(v){ view=v; document.getElementById('tog-day').className='tog'+(v==='day'?' active':''); document.getElementById('tog-tasks').className='tog'+(v==='tasks'?' active':''); document.getElementById('tog-archive').className='tog'+(v==='archive'?' active':''); render(); }

// ─── SUBTASK HELPERS ──────────────────────────────────────────────────────────
// Subtasks/notes are nested in the parent task, so they sync as part of it:
// every mutation bumps the parent task's `modified`.
function addSubtask(tid, name) {
  const t=tasks.find(x=>x.id===tid); if(!t||!name.trim()) return;
  if(!t.subtasks) t.subtasks=[];
  t.subtasks.push({id:Date.now()+Math.floor(Math.random()*9999),name:name.trim(),dayHours:{},urgent:false,done:false});
  t.modified=Date.now(); save();
}
function updateSubtask(tid, sid, patch) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  const s=t.subtasks&&t.subtasks.find(x=>x.id===sid); if(!s) return;
  Object.assign(s, patch); t.modified=Date.now(); save();
}
function deleteSubtask(tid, sid) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  t.subtasks=(t.subtasks||[]).filter(x=>x.id!==sid); t.modified=Date.now(); save();
}
function updateSubtaskDayHours(tid, sid, day, hours) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  const s=t.subtasks&&t.subtasks.find(x=>x.id===sid); if(!s) return;
  if(!s.dayHours) s.dayHours={};
  if(hours<=0) delete s.dayHours[day]; else s.dayHours[day]=hours;
  t.modified=Date.now(); save();
}

// ─── NOTE HELPERS ─────────────────────────────────────────────────────────────
function addNote(tid, text) {
  const t=tasks.find(x=>x.id===tid); if(!t||!text.trim()) return;
  if(!t.notes) t.notes=[];
  t.notes.push({id:Date.now(),text:text.trim(),createdAt:Date.now()});
  t.modified=Date.now(); save();
}
function deleteNote(tid, nid) {
  const t=tasks.find(x=>x.id===tid); if(!t) return;
  t.notes=(t.notes||[]).filter(x=>x.id!==nid); t.modified=Date.now(); save();
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openTaskModal(tid) {
  const overlay=document.getElementById('task-modal');
  overlay.innerHTML='';
  overlay.classList.remove('hidden');

  // Dismiss on overlay click
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  const sheet=document.createElement('div'); sheet.className='modal-sheet';
  const handle=document.createElement('div'); handle.className='modal-handle';

  // ── Header ──
  const mhdr=document.createElement('div'); mhdr.className='modal-header';
  const title=document.createElement('div'); title.className='modal-title';
  const closeBtn=document.createElement('button'); closeBtn.className='icon-btn'; closeBtn.style.cssText='font-size:22px;opacity:0.6'; closeBtn.textContent='×';
  closeBtn.addEventListener('click', closeModal);
  mhdr.appendChild(title); mhdr.appendChild(closeBtn);

  const body=document.createElement('div'); body.className='modal-body';

  sheet.appendChild(handle); sheet.appendChild(mhdr); sheet.appendChild(body);
  overlay.appendChild(sheet);

  // Render modal content from current task state
  function renderModal() {
    const t=tasks.find(x=>x.id===tid);
    if(!t){ closeModal(); return; }
    title.textContent=t.name;
    body.innerHTML='';

    // ── Edit fields ──
    const editSection=document.createElement('div'); editSection.className='modal-section';
    const editLabel=document.createElement('div'); editLabel.className='modal-section-label'; editLabel.textContent='Task details';
    editSection.appendChild(editLabel);

    // Name
    const nameField=document.createElement('div'); nameField.className='modal-field';
    const nameLbl=document.createElement('label'); nameLbl.textContent='Name';
    const nameInp=document.createElement('input'); nameInp.className='modal-input'; nameInp.value=t.name; nameInp.type='text';
    nameInp.addEventListener('change',()=>{ t.name=nameInp.value.trim()||t.name; title.textContent=t.name; t.modified=Date.now(); save(); render(); });
    nameField.appendChild(nameLbl); nameField.appendChild(nameInp); editSection.appendChild(nameField);

    // Category
    const catField=document.createElement('div'); catField.className='modal-field';
    const catLbl=document.createElement('label'); catLbl.textContent='Category';
    const catSel=document.createElement('select'); catSel.className='modal-input'; catSel.style.cursor='pointer';
    CATS.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; if(c.id===t.cat) o.selected=true; catSel.appendChild(o); });
    catSel.addEventListener('change',()=>{ t.cat=catSel.value; t.modified=Date.now(); save(); render(); });
    catField.appendChild(catLbl); catField.appendChild(catSel); editSection.appendChild(catField);

    // Urgent + done row
    const flagRow=document.createElement('div'); flagRow.style.cssText='display:flex;gap:16px;align-items:center;margin-top:4px';
    const urgLabel=document.createElement('label'); urgLabel.className='urg-label';
    const urgCb=document.createElement('input'); urgCb.type='checkbox'; urgCb.checked=!!t.urgent; urgCb.style.cssText='accent-color:var(--red);width:16px;height:16px';
    urgCb.addEventListener('change',()=>{ t.urgent=urgCb.checked; t.modified=Date.now(); save(); render(); });
    urgLabel.appendChild(urgCb); urgLabel.appendChild(document.createTextNode(' Urgent')); flagRow.appendChild(urgLabel);
    const doneLabel=document.createElement('label'); doneLabel.className='urg-label';
    const doneCb=document.createElement('input'); doneCb.type='checkbox'; doneCb.checked=!!t.done; doneCb.style.cssText='accent-color:var(--green);width:16px;height:16px';
    doneCb.addEventListener('change',()=>{ t.done=doneCb.checked; t.doneAt=t.done?Date.now():null; t.modified=Date.now(); save(); render(); renderModal(); });
    doneLabel.appendChild(doneCb); doneLabel.appendChild(document.createTextNode(' Done')); flagRow.appendChild(doneLabel);
    editSection.appendChild(flagRow);
    body.appendChild(editSection);

    // ── Subtasks ──
    const stSection=document.createElement('div'); stSection.className='modal-section';
    const stLabel=document.createElement('div'); stLabel.className='modal-section-label'; stLabel.textContent=`Subtasks (${(t.subtasks||[]).length})`;
    stSection.appendChild(stLabel);

    const subtasks=t.subtasks||[];
    subtasks.forEach(s=>{
      const sRow=document.createElement('div'); sRow.className='subtask-row';
      const sCb=document.createElement('input'); sCb.type='checkbox'; sCb.className='subtask-done-check'; sCb.checked=!!s.done;
      sCb.addEventListener('change',()=>{ updateSubtask(tid,s.id,{done:sCb.checked,doneAt:sCb.checked?Date.now():null}); renderModal(); });
      const sName=document.createElement('span'); sName.className='subtask-name'+(s.done?' done':''); sName.textContent=s.name;
      const dhTotal=Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0);
      const sHrs=document.createElement('span'); sHrs.className='subtask-hours-summary'; sHrs.textContent=dhTotal>0?`${dhTotal}h`:'';
      // Expand/collapse subtask detail
      const expBtn=document.createElement('button'); expBtn.className='subtask-expand-btn'; expBtn.textContent='▾';
      const delBtn=document.createElement('button'); delBtn.className='icon-btn'; delBtn.style.cssText='font-size:16px;opacity:0.4'; delBtn.textContent='×';
      delBtn.addEventListener('click',()=>{ deleteSubtask(tid,s.id); renderModal(); });
      sRow.appendChild(sCb); sRow.appendChild(sName); sRow.appendChild(sHrs); sRow.appendChild(expBtn); sRow.appendChild(delBtn);
      stSection.appendChild(sRow);

      // Subtask detail panel (day/hours + urgent)
      const detail=document.createElement('div'); detail.className='subtask-detail'; detail.style.display='none';

      // Urgent flag
      const stUrgRow=document.createElement('div'); stUrgRow.style.cssText='margin-bottom:10px';
      const stUrgLbl=document.createElement('label'); stUrgLbl.className='urg-label';
      const stUrgCb=document.createElement('input'); stUrgCb.type='checkbox'; stUrgCb.checked=!!s.urgent; stUrgCb.style.cssText='accent-color:var(--red);width:15px;height:15px';
      stUrgCb.addEventListener('change',()=>{ updateSubtask(tid,s.id,{urgent:stUrgCb.checked}); });
      stUrgLbl.appendChild(stUrgCb); stUrgLbl.appendChild(document.createTextNode(' Urgent')); stUrgRow.appendChild(stUrgLbl);
      detail.appendChild(stUrgRow);

      // Day/hours rows
      const dhLabel=document.createElement('div'); dhLabel.style.cssText='font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px'; dhLabel.textContent='Hours by day';
      detail.appendChild(dhLabel);

      function renderDhRows() {
        // Remove existing dh rows (after label and urgent row)
        detail.querySelectorAll('.dh-mini-row').forEach(r=>r.remove());
        detail.querySelectorAll('.dh-add-day-wrap').forEach(r=>r.remove());
        const dh=s.dayHours||{};
        Object.entries(dh).forEach(([day,hours])=>{
          const row=document.createElement('div'); row.className='dh-mini-row';
          const lbl=document.createElement('span'); lbl.className='dh-mini-label'; lbl.textContent=day;
          const inp=document.createElement('input'); inp.className='dh-mini-input'; inp.type='number'; inp.min='0'; inp.step='0.5'; inp.value=hours;
          inp.addEventListener('change',()=>{ updateSubtaskDayHours(tid,s.id,day,parseFloat(inp.value)||0); sHrs.textContent=Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0)+'h'; });
          const del=document.createElement('button'); del.className='dh-mini-del'; del.textContent='×';
          del.addEventListener('click',()=>{ updateSubtaskDayHours(tid,s.id,day,0); renderDhRows(); sHrs.textContent=Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0)>0?Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0)+'h':''; });
          row.appendChild(lbl); row.appendChild(inp); row.appendChild(del); detail.appendChild(row);
        });
        // Add day chips
        const addWrap=document.createElement('div'); addWrap.className='dh-add-day-wrap';
        DAYS.filter(d=>!(d in (s.dayHours||{}))).forEach(d=>{
          const chip=document.createElement('button'); chip.className='log-btn'; chip.style.cssText='font-size:11px;padding:3px 8px'; chip.textContent=`+ ${d}`;
          chip.addEventListener('click',()=>{ updateSubtaskDayHours(tid,s.id,d,1); renderDhRows(); sHrs.textContent=Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0)+'h'; });
          addWrap.appendChild(chip);
        });
        detail.appendChild(addWrap);
      }
      renderDhRows();

      expBtn.addEventListener('click',()=>{
        const open=detail.style.display==='block';
        detail.style.display=open?'none':'block';
        expBtn.textContent=open?'▾':'▴';
      });
      stSection.appendChild(detail);
    });

    // Add subtask input
    const stAddRow=document.createElement('div'); stAddRow.style.cssText='display:flex;gap:8px;margin-top:6px';
    const stInp=document.createElement('input'); stInp.className='modal-input'; stInp.placeholder='New subtask…'; stInp.style.cssText='flex:1;font-size:14px;height:36px';
    const stBtn=document.createElement('button'); stBtn.className='btn-primary'; stBtn.style.cssText='padding:6px 14px;font-size:13px;white-space:nowrap'; stBtn.textContent='+ Add';
    stBtn.addEventListener('click',()=>{ addSubtask(tid,stInp.value); stInp.value=''; render(); renderModal(); });
    stInp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addSubtask(tid,stInp.value); stInp.value=''; render(); renderModal(); } });
    stAddRow.appendChild(stInp); stAddRow.appendChild(stBtn);
    stSection.appendChild(stAddRow);
    body.appendChild(stSection);

    // ── Notes ──
    const notesSection=document.createElement('div'); notesSection.className='modal-section';
    const notesLabel=document.createElement('div'); notesLabel.className='modal-section-label'; notesLabel.textContent=`Notes (${(t.notes||[]).length})`;
    notesSection.appendChild(notesLabel);

    // Existing notes newest first
    [...(t.notes||[])].reverse().forEach(n=>{
      const nRow=document.createElement('div'); nRow.className='note-row';
      const nMeta=document.createElement('div'); nMeta.className='note-meta';
      const nDate=document.createElement('span'); nDate.textContent=new Date(n.createdAt).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const nDel=document.createElement('button'); nDel.className='icon-btn'; nDel.style.cssText='font-size:14px;opacity:0.4'; nDel.textContent='×';
      nDel.addEventListener('click',()=>{ deleteNote(tid,n.id); renderModal(); });
      nMeta.appendChild(nDate); nMeta.appendChild(nDel);
      const nText=document.createElement('div'); nText.className='note-text'; nText.textContent=n.text;
      nRow.appendChild(nMeta); nRow.appendChild(nText); notesSection.appendChild(nRow);
    });

    // Add note
    const noteArea=document.createElement('textarea'); noteArea.className='note-add-area'; noteArea.placeholder='Add a note…';
    const noteBtn=document.createElement('button'); noteBtn.className='btn-primary'; noteBtn.style.cssText='margin-top:8px;padding:7px 16px;font-size:13px'; noteBtn.textContent='Add note';
    noteBtn.addEventListener('click',()=>{ addNote(tid,noteArea.value); noteArea.value=''; render(); renderModal(); });
    notesSection.appendChild(noteArea); notesSection.appendChild(noteBtn);
    body.appendChild(notesSection);

    // ── Danger zone ──
    const danger=document.createElement('div'); danger.style.cssText='margin-top:8px;padding-top:16px;border-top:0.5px solid var(--border)';
    const delBtn=document.createElement('button'); delBtn.className='btn-secondary'; delBtn.style.cssText='color:var(--red);border-color:var(--red);opacity:0.7;font-size:13px'; delBtn.textContent='Delete task';
    delBtn.addEventListener('click',()=>{ if(confirm(`Delete "${t.name}"?`)){ deleteTask(tid); closeModal(); } });
    danger.appendChild(delBtn); body.appendChild(danger);
  }

  renderModal();
}

function closeModal() {
  const overlay=document.getElementById('task-modal');
  overlay.classList.add('hidden');
  overlay.innerHTML='';
}

// ─── TASK CARD ────────────────────────────────────────────────────────────────
function taskCard(t, showDays) {
  const cat=CATS.find(c=>c.id===t.cat)||CATS[0];
  const dh=t.dayHours||{};
  const plannedTotal=Object.values(dh).reduce((s,h)=>s+h,0);
  const subtasks=t.subtasks||[];
  const stDone=subtasks.filter(s=>s.done).length;
  const hasExpandable=subtasks.length>0||(t.notes&&t.notes.length>0);

  const card=document.createElement('div'); card.className='task-card'+(t.urgent&&!t.done?' urgent-card':'');

  // ── Header ──
  const hdr=document.createElement('div'); hdr.className='task-header';
  const ta=document.createElement('div'); ta.className='task-title-area';
  const tn=document.createElement('div'); tn.className='task-name'+(t.done?' done':''); tn.textContent=t.name;
  const badges=document.createElement('div'); badges.className='task-badges';
  const cb=document.createElement('span'); cb.className='tbadge'; cb.style.cssText=`background:${cat.color}22;color:${cat.color};border:0.5px solid ${cat.color}55;font-size:11px;padding:2px 7px;border-radius:4px;line-height:1.5`; cb.textContent=cat.name; badges.appendChild(cb);
  if(showDays&&Object.keys(dh).length){
    Object.entries(dh).forEach(([d,h])=>{ const db=document.createElement('span'); db.className='tbadge size-badge'; db.textContent=`${d} ${h}h`; badges.appendChild(db); });
  }
  if(subtasks.length){ const sb=document.createElement('span'); sb.className='tbadge size-badge'; sb.textContent=`${stDone}/${subtasks.length} subtasks`; badges.appendChild(sb); }
  if(t.notes&&t.notes.length){ const nb=document.createElement('span'); nb.className='tbadge size-badge'; nb.textContent=`${t.notes.length} note${t.notes.length>1?'s':''}`; badges.appendChild(nb); }
  if(t.urgent&&!t.done){ const ub=document.createElement('span'); ub.className='tbadge urg-badge'; ub.textContent='Urgent'; badges.appendChild(ub); }
  if(t.done){ const db2=document.createElement('span'); db2.className='tbadge done-badge'; db2.textContent='Done'; badges.appendChild(db2); }
  ta.appendChild(tn); ta.appendChild(badges);

  const acts=document.createElement('div'); acts.className='task-actions'; acts.style.cssText='gap:8px';
  // Urgent flag — bigger
  const fb=document.createElement('button'); fb.className='icon-btn';
  fb.style.cssText='font-size:22px;opacity:'+(t.urgent?'1':'0.35')+';'+(t.urgent?'color:#E24B4A':'');
  fb.textContent='⚑'; fb.addEventListener('click',e=>{ e.stopPropagation(); toggleUrgent(t.id); });
  // Edit/modal button — bigger
  const editBtn=document.createElement('button'); editBtn.className='icon-btn';
  editBtn.style.cssText='font-size:20px;opacity:0.55';
  editBtn.textContent='✎'; editBtn.addEventListener('click',e=>{ e.stopPropagation(); openTaskModal(t.id); });
  acts.appendChild(fb); acts.appendChild(editBtn);
  hdr.appendChild(ta); hdr.appendChild(acts); card.appendChild(hdr);

  // ── Expand panel ──
  const panel=document.createElement('div');
  panel.style.cssText='display:none;border-top:0.5px solid var(--border);padding:12px 14px 14px';
  let panelOpen=false;

  // Clicking the title area (name + badges) toggles the panel
  ta.style.cursor='pointer';
  ta.addEventListener('click', ()=>{
    panelOpen=!panelOpen;
    if(panelOpen){ renderPanel(); panel.style.display='block'; }
    else { panel.style.display='none'; }
  });
  function renderPanel() {
    panel.innerHTML='';
    // Subtasks
    if(subtasks.length){
      const stLbl=document.createElement('div'); stLbl.style.cssText='font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px'; stLbl.textContent='Subtasks';
      panel.appendChild(stLbl);
      subtasks.forEach(s=>{
        const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)';
        const ck=document.createElement('input'); ck.type='checkbox'; ck.checked=!!s.done; ck.style.cssText='width:17px;height:17px;accent-color:var(--green);cursor:pointer;flex-shrink:0';
        ck.addEventListener('change',()=>{ updateSubtask(t.id,s.id,{done:ck.checked,doneAt:ck.checked?Date.now():null}); s.done=ck.checked; nm.className='st-nm'+(s.done?' done':''); });

        // Subtask name — tap to edit inline
        const nm=document.createElement('span'); nm.className='st-nm'+(s.done?' done':''); nm.style.cssText='font-size:14px;flex:1;min-width:0;cursor:text'; nm.textContent=s.name;
        nm.addEventListener('click',()=>{
          const inp=document.createElement('input');
          inp.style.cssText='font-size:14px;flex:1;width:100%;font-family:inherit;border:none;border-bottom:1.5px solid var(--accent);background:transparent;color:var(--text);outline:none;padding:0';
          inp.value=s.name;
          nm.replaceWith(inp); inp.focus(); inp.select();
          function commit(){ const v=inp.value.trim()||s.name; s.name=v; updateSubtask(t.id,s.id,{name:v}); inp.replaceWith(nm); nm.textContent=v; }
          inp.addEventListener('blur', commit);
          inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ inp.value=s.name; inp.blur(); } });
        });

        const dhT=Object.values(s.dayHours||{}).reduce((a,b)=>a+b,0);
        row.appendChild(ck); row.appendChild(nm);
        if(dhT>0){ const hrs=document.createElement('span'); hrs.style.cssText='font-size:12px;color:var(--text3);white-space:nowrap'; hrs.textContent=dhT+'h'; row.appendChild(hrs); }
        panel.appendChild(row);
      });
    }
    // Notes
    if(t.notes&&t.notes.length){
      const nLbl=document.createElement('div'); nLbl.style.cssText='font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-top:'+(subtasks.length?'14px':'0')+';margin-bottom:8px'; nLbl.textContent='Notes';
      panel.appendChild(nLbl);
      [...t.notes].reverse().forEach(n=>{
        const nRow=document.createElement('div'); nRow.style.cssText='margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)';
        const nMeta=document.createElement('div'); nMeta.style.cssText='font-size:11px;color:var(--text3);margin-bottom:3px';
        nMeta.textContent=new Date(n.createdAt).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

        // Note text — tap to edit inline
        const nText=document.createElement('div'); nText.style.cssText='font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text'; nText.textContent=n.text;
        nText.addEventListener('click',()=>{
          const ta=document.createElement('textarea');
          ta.style.cssText='width:100%;font-size:14px;font-family:inherit;line-height:1.5;border:none;border-bottom:1.5px solid var(--accent);background:transparent;color:var(--text);outline:none;resize:none;padding:0;overflow:hidden';
          ta.value=n.text;
          nText.replaceWith(ta);
          ta.style.height=ta.scrollHeight+'px';
          ta.focus();
          function commit(){ const v=ta.value.trim()||n.text; n.text=v; const tk=tasks.find(x=>x.id===t.id); if(tk){ const note=tk.notes?.find(x=>x.id===n.id); if(note) note.text=v; tk.modified=Date.now(); } save(); ta.replaceWith(nText); nText.textContent=v; }
          ta.addEventListener('blur', commit);
          ta.addEventListener('keydown',e=>{ if(e.key==='Escape'){ ta.value=n.text; ta.blur(); } ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
        });

        nRow.appendChild(nMeta); nRow.appendChild(nText); panel.appendChild(nRow);
      });
    }
    if(!hasExpandable){
      const em=document.createElement('div'); em.style.cssText='font-size:13px;color:var(--text3);font-style:italic'; em.textContent='No subtasks or notes yet — tap ✎ to add.'; panel.appendChild(em);
    }
  }

  card.appendChild(panel);

  // ── Progress / day-hours section ──
  const prog=document.createElement('div'); prog.className='task-progress';
  const ptop=document.createElement('div'); ptop.className='progress-top';
  const pl=document.createElement('span'); pl.className='progress-label'; pl.textContent=`${plannedTotal}h planned`;
  const mb=document.createElement('button'); mb.className='log-btn'; mb.textContent=t.done?'Mark active':'Mark done'; mb.addEventListener('click',()=>markDone(t.id));
  ptop.appendChild(pl); ptop.appendChild(mb);
  prog.appendChild(ptop);

  if(!t.done){
    const dhSection=document.createElement('div'); dhSection.style.cssText='border-top:0.5px solid var(--border);padding:10px 0 4px';
    const dhTop=document.createElement('div'); dhTop.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px';
    const dhLabel=document.createElement('div'); dhLabel.style.cssText='font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em'; dhLabel.textContent='Planned hours by day';
    dhTop.appendChild(dhLabel);
    const addDayBtn=document.createElement('button'); addDayBtn.className='log-btn'; addDayBtn.style.cssText='font-size:11px;padding:3px 8px'; addDayBtn.textContent='+ Add day';
    const dayPicker=document.createElement('div'); dayPicker.style.cssText='display:none;margin-bottom:8px';
    const dayChips=document.createElement('div'); dayChips.style.cssText='display:flex;gap:5px;flex-wrap:wrap';
    DAYS.forEach(d=>{
      const chip=document.createElement('button'); chip.className='log-btn'; chip.style.cssText='font-size:12px;padding:4px 10px'; chip.textContent=d;
      chip.addEventListener('click',()=>{ if(!(d in dh)){ updateDayHours(t.id,d,1); } dayPicker.style.display='none'; addDayBtn.textContent='+ Add day'; });
      dayChips.appendChild(chip);
    });
    dayPicker.appendChild(dayChips);
    addDayBtn.addEventListener('click',()=>{ const open=dayPicker.style.display==='block'; dayPicker.style.display=open?'none':'block'; addDayBtn.textContent=open?'+ Add day':'Cancel'; });
    dhTop.appendChild(addDayBtn); dhSection.appendChild(dhTop); dhSection.appendChild(dayPicker);
    Object.entries(dh).forEach(([day,hours])=>{
      const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px';
      const dl=document.createElement('span'); dl.style.cssText='font-size:13px;color:var(--text2);min-width:32px'; dl.textContent=day;
      const hi=document.createElement('input'); hi.className='hours-input'; hi.type='number'; hi.min='0'; hi.step='0.5'; hi.value=hours; hi.style.cssText='width:60px';
      hi.addEventListener('change',()=>updateDayHours(t.id,day,parseFloat(hi.value)||0));
      const rBtn=document.createElement('button'); rBtn.className='log-btn'; rBtn.style.cssText='font-size:11px;padding:4px 8px'; rBtn.textContent='Roll →';
      const rSel=document.createElement('select'); rSel.className='af-select'; rSel.style.cssText='height:30px;font-size:12px;padding:0 6px';
      DAYS.filter(d=>d!==day).forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; rSel.appendChild(o); });
      rSel.value=DAYS[(DAYS.indexOf(day)+1)%7];
      rBtn.addEventListener('click',()=>{ rolloverTask(t.id,day,rSel.value,parseFloat(hi.value)||hours); });
      const delDay=document.createElement('button'); delDay.className='icon-btn'; delDay.style.cssText='font-size:15px;opacity:0.4'; delDay.textContent='×';
      delDay.addEventListener('click',()=>updateDayHours(t.id,day,0));
      row.appendChild(dl); row.appendChild(hi); row.appendChild(rBtn); row.appendChild(rSel); row.appendChild(delDay);
      dhSection.appendChild(row);
    });
    prog.appendChild(dhSection);
  }

  card.appendChild(prog);

  // ── Swipe-left to mark complete (touch only) ──
  const swipeWrap = document.createElement('div');
  swipeWrap.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:10px';
  const action = document.createElement('div');
  const actionColor = t.done ? 'var(--bg3)' : 'var(--green)';
  action.style.cssText = `position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:${actionColor};color:#fff;font-size:14px;font-weight:600;border-radius:var(--radius)`;
  action.textContent = t.done ? 'Reopen' : 'Done';
  card.style.marginBottom = '0';
  card.style.position = 'relative';
  card.style.willChange = 'transform';
  swipeWrap.appendChild(action);
  swipeWrap.appendChild(card);

  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;
  const THRESHOLD = 90;
  card.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; dragging = true; decided = false; horizontal = false;
    card.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    const mx = e.touches[0].clientX - startX, my = e.touches[0].clientY - startY;
    if (!decided) {
      if (Math.abs(mx) > 8 || Math.abs(my) > 8) { decided = true; horizontal = Math.abs(mx) > Math.abs(my); }
    }
    if (!horizontal) return;
    dx = Math.min(0, mx);
    card.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  card.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.2s ease';
    if (horizontal && -dx >= THRESHOLD) {
      card.style.transform = 'translateX(-100%)';
      setTimeout(() => markDone(t.id), 180);
    } else {
      card.style.transform = 'translateX(0)';
    }
  });

  return swipeWrap;
}

// ─── ADD FORM ─────────────────────────────────────────────────────────────────
function renderAddForm() {
  const f=document.createElement('div'); f.className='add-form';
  const r1=document.createElement('div'); r1.className='af-row';
  const inp=document.createElement('input'); inp.className='af-input'; inp.id='t-name'; inp.type='text'; inp.placeholder='Task name...';
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });
  r1.appendChild(inp);
  const r2=document.createElement('div'); r2.className='af-row';
  const catEl=makeCS(CATS.map(c=>({value:c.id,label:c.name,color:c.color})),selCat,val=>{ selCat=val; });
  r2.appendChild(catEl);
  const ul=document.createElement('label'); ul.className='urg-label';
  const uc=document.createElement('input'); uc.type='checkbox'; uc.id='t-urgent'; uc.addEventListener('change',e=>{ addUrgent=e.target.checked; });
  ul.appendChild(uc); ul.appendChild(document.createTextNode('Urgent')); r2.appendChild(ul);
  const btn=document.createElement('button'); btn.className='btn-primary'; btn.textContent='Add'; btn.addEventListener('click',addTask); r2.appendChild(btn);

  // Compact day chip picker
  const r3=document.createElement('div'); r3.style.marginTop='10px';
  const chipWrap=document.createElement('div'); chipWrap.style.cssText='display:flex;gap:5px;flex-wrap:wrap;align-items:flex-start';

  function refreshChips(){
    chipWrap.innerHTML='';
    DAYS.forEach(d=>{
      const col=document.createElement('div'); col.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px';
      const chip=document.createElement('button');
      const on=d in selDayHours;
      chip.className='dpick'+(on?' on':''); chip.textContent=d;
      chip.addEventListener('click',()=>{
        if(d in selDayHours) delete selDayHours[d]; else selDayHours[d]=1;
        refreshChips();
      });
      col.appendChild(chip);
      if(on){
        const hi=document.createElement('input'); hi.className='hours-input'; hi.type='number'; hi.min='0.5'; hi.step='0.5'; hi.value=selDayHours[d]; hi.style.cssText='width:44px;font-size:12px;height:28px;padding:0 4px';
        hi.addEventListener('input',()=>{ selDayHours[d]=parseFloat(hi.value)||1; });
        col.appendChild(hi);
      }
      chipWrap.appendChild(col);
    });
  }
  refreshChips();
  r3.appendChild(chipWrap);
  f.appendChild(r1); f.appendChild(r2); f.appendChild(r3);
  return f;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('wlabel').textContent = getWeekLabel(weekOffset);
  const active=tasks.filter(t=>!t.done&&!t.deleted), done=tasks.filter(t=>t.done&&!t.deleted);
  const urgent=active.filter(t=>t.urgent).length;
  const wStart=getMonday(weekOffset).getTime(), wEnd=wStart+7*864e5;
  const doneThisWeek=done.filter(t=>t.doneAt&&t.doneAt>=wStart&&t.doneAt<wEnd).length;
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-n">${active.length}</div><div class="stat-l">Active</div></div><div class="stat"><div class="stat-n" style="color:#1D9E75">${doneThisWeek}</div><div class="stat-l">Done this week</div></div><div class="stat"><div class="stat-n" style="color:#E24B4A">${urgent}</div><div class="stat-l">Urgent</div></div>`;

  const main=document.getElementById('main'); main.innerHTML='';
  const mkey=getMondayStr(weekOffset);

  if(!isAuthed()) maybeSilentRefresh();
  if(isAuthed() && !calCache[mkey] && !calFetching.has(mkey)) fetchCalendarWeek(mkey);

  const cached=getCalData(mkey);
  const calH=cached ? cached.calH : {};
  const calData=cached ? cached.calData : {};
  const calLoading=calFetching.has(mkey);

  renderDeadlines(main);

  if(view==='day'){
    const lbl=document.createElement('div'); lbl.className='section-label';
    const lblText=document.createElement('span'); lblText.textContent='Week at a glance';
    lbl.appendChild(lblText);
    if(!cached && calLoading){
      const spin=document.createElement('span'); spin.style.cssText='font-size:11px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0;animation:pulse 1.2s ease-in-out infinite'; spin.textContent='Syncing…'; lbl.appendChild(spin);
    } else if(isAuthed()){
      const rfbtn=document.createElement('button'); rfbtn.className='nb'; rfbtn.style.cssText='font-size:11px;padding:2px 8px'; rfbtn.textContent='↻ Refresh';
      rfbtn.addEventListener('click',()=>{ delete calCache[mkey]; try{ const s=JSON.parse(localStorage.getItem('calCache')||'{}'); delete s[mkey]; localStorage.setItem('calCache',JSON.stringify(s)); }catch(e){} calFetching.delete(mkey); render(); });
      lbl.appendChild(rfbtn);
    }
    main.appendChild(lbl);

    // Row labels
    const rowLabels=document.createElement('div'); rowLabels.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:2px';
    const blank=document.createElement('div');
    rowLabels.appendChild(blank);
    DAYS.forEach(d=>{
      const tab=document.createElement('button'); tab.className='day-tab'+(d===selDay?' active':'');
      const tc=tasks.filter(t=>!t.done&&!t.deleted&&(t.dayHours||{})[d]).length;
      tab.textContent=d+(tc>0?` ${tc}`:'');
      tab.addEventListener('click',()=>{ selDay=d; render(); });
      rowLabels.appendChild(tab);
    });
    main.appendChild(rowLabels);

    // Tasks row
    const tasksRow=document.createElement('div'); tasksRow.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:3px';
    const tRowLbl=document.createElement('div'); tRowLbl.style.cssText='font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;line-height:1.2'; tRowLbl.textContent='Tasks';
    tasksRow.appendChild(tRowLbl);
    let totalTaskPlanned=0;
    DAYS.forEach(d=>{
      const taskPlanned=tasks.filter(t=>!t.done&&!t.deleted&&(t.dayHours||{})[d]).reduce((s,t)=>s+(t.dayHours[d]||0),0);
      totalTaskPlanned+=taskPlanned;
      const col=hoursColor(taskPlanned);
      const hbox=document.createElement('div'); hbox.className=`hbox ${col}`;
      hbox.innerHTML=`<div class="hbox-n">${taskPlanned>0?taskPlanned.toFixed(1)+'h':'—'}</div>`;
      tasksRow.appendChild(hbox);
    });
    main.appendChild(tasksRow);

    // Calendar row
    const calRow=document.createElement('div'); calRow.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px';
    const cRowLbl=document.createElement('div'); cRowLbl.style.cssText='font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;line-height:1.2'; cRowLbl.textContent='Cal';
    calRow.appendChild(cRowLbl);
    let totalCal=0;
    DAYS.forEach(d=>{
      const calHours=calH[d]||0; totalCal+=calHours;
      const col=hoursColor(calHours);
      const hbox=document.createElement('div'); hbox.className=`hbox ${col}`;
      hbox.innerHTML=`<div class="hbox-n">${calHours>0?calHours.toFixed(1)+'h':'—'}</div>`;
      calRow.appendChild(hbox);
    });
    main.appendChild(calRow);

    const ws=document.createElement('div'); ws.className='week-summary';
    if(!isAuthed()) ws.textContent=`${totalTaskPlanned.toFixed(1)}h planned in tasks this week`;
    else if(calLoading&&!cached) ws.textContent='Loading calendar…';
    else ws.textContent=`${totalTaskPlanned.toFixed(1)}h tasks · ${totalCal.toFixed(1)}h calendar`;
    main.appendChild(ws);

    const calEvs=calData[selDay]||[];
    if(calEvs.length){
      const cl=document.createElement('div'); cl.className='section-label'; cl.textContent=`Calendar — ${selDay}`; main.appendChild(cl);
      const cc=document.createElement('div'); cc.className='cal-card';
      calEvs.forEach(ev=>{ const r=document.createElement('div'); r.className='cal-ev'; r.innerHTML=`<div class="cal-dot"></div><span class="cal-time">${ev.time}</span><span class="cal-title">${ev.title}</span>`; cc.appendChild(r); });
      main.appendChild(cc);
    } else if(isAuthed()&&calLoading&&!cached){
      const cl=document.createElement('div'); cl.className='section-label'; cl.textContent=`Calendar — ${selDay}`; main.appendChild(cl);
      const ph=document.createElement('div'); ph.className='cal-card'; ph.innerHTML=`<div class="cal-ev" style="justify-content:center;color:var(--text3);font-size:13px;font-style:italic">Loading events…</div>`; main.appendChild(ph);
    }

    const dayTasks=tasks.filter(t=>!t.done&&!t.deleted&&(t.dayHours||{})[selDay]).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
    const tl=document.createElement('div'); tl.className='section-label'; tl.textContent=`Tasks — ${selDay}`; main.appendChild(tl);
    if(!dayTasks.length){ const em=document.createElement('div'); em.className='empty-msg'; em.textContent='No tasks planned for this day'; main.appendChild(em); }
    else{ dayTasks.forEach(t=>main.appendChild(taskCard(t,false))); }
    main.appendChild(renderAddForm());

  } else if(view==='tasks') {
    main.appendChild(renderAddForm());
    const tl=document.createElement('div'); tl.className='section-label'; tl.textContent='All tasks'; main.appendChild(tl);
    CATS.forEach(c=>{
      const ct=tasks.filter(t=>t.cat===c.id&&!t.deleted&&!t.done); if(!ct.length) return;
      const isOpen=!collapsed[c.id];
      const block=document.createElement('div'); block.className='cat-block';
      block.style.borderLeft=`3px solid ${c.color}`;
      const ah=ct.filter(t=>!t.done).length;
      const hdr=document.createElement('div'); hdr.className='cat-hdr';
      hdr.style.background=`${c.color}1A`;
      hdr.innerHTML=`<div class="cdot" style="background:${c.color}"></div><span class="cat-name-lbl">${c.name}</span><span class="cat-meta-lbl">${ah} active</span><span style="font-size:14px;color:var(--text3)">${isOpen?'▴':'▾'}</span>`;
      hdr.addEventListener('click',()=>{ collapsed[c.id]=!collapsed[c.id]; save(); render(); });
      block.appendChild(hdr);
      if(isOpen){ ct.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)).forEach(t=>{ const w=document.createElement('div'); w.style.borderTop='0.5px solid var(--border)'; const tc=taskCard(t,true); tc.style.marginBottom='0'; tc.style.borderRadius='0'; w.appendChild(tc); block.appendChild(w); }); }
      main.appendChild(block);
    });
  } else {
    // Archive view
    const tl=document.createElement('div'); tl.className='section-label'; tl.style.marginTop='0'; tl.textContent='Completed tasks'; main.appendChild(tl);
    renderArchive(main);
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
document.getElementById('prev').addEventListener('click',()=>{ weekOffset--; render(); });
document.getElementById('next').addEventListener('click',()=>{ weekOffset++; render(); });
document.getElementById('todaybtn').addEventListener('click',()=>{ weekOffset=0; render(); });
document.getElementById('tog-day').addEventListener('click',()=>setView('day'));
document.getElementById('tog-tasks').addEventListener('click',()=>setView('tasks'));
document.getElementById('tog-archive').addEventListener('click',()=>setView('archive'));

// Close any open custom-select dropdown when clicking elsewhere (single global handler)
document.addEventListener('click', () => {
  document.querySelectorAll('.cs-dropdown.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.cs-trigger.open').forEach(t => t.classList.remove('open'));
});

// Request persistent storage so the browser is less likely to evict your data
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(()=>{});
}

// Register service worker for PWA offline support
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:', e)); });
}

handleOAuthRedirect(); // parse token from redirect hash before anything else
loadToken();
loadCalCache();
load();
migrateTasks();
renderAuthArea();
render();
waitForGis();

// Pull-and-merge when the app regains focus (e.g. switching back after editing
// on another device). Throttled so rapid toggles don't hammer Drive.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isAuthed() && Date.now() - lastSyncAt > 5000) syncNow();
});
window.addEventListener('focus', () => {
  if (isAuthed() && Date.now() - lastSyncAt > 5000) syncNow();
});

// Initial pull-merge-push on boot if already connected.
if (isAuthed()) syncNow();
</script>
</body>
</html>
