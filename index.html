// ─── TASK CARD ────────────────────────────────────────────────────────────────
function taskCard(t, showDays) {
  const cat=CATS.find(c=>c.id===t.cat)||CATS[0];
  const subtasks=t.subtasks||[];
  const stDone=subtasks.filter(s=>s.done).length;
  const hasExpandable=subtasks.length>0||(t.notes&&t.notes.length>0);

  const card=document.createElement('div'); card.className='task-card'+(t.urgent&&!t.done?' urgent-card':'');

  // ── Header ──
  const hdr=document.createElement('div'); hdr.className='task-header';
  const ta=document.createElement('div'); ta.className='task-title-area';
  const tn=document.createElement('div'); tn.className='task-name'+(t.done?' done':''); tn.textContent=t.name;
  const badges=document.createElement('div'); badges.className='task-badges';
  const cb=document.createElement('span'); cb.className='tbadge'; cb.style.cssText=`background:${cat.color}22;color:${cat.color};border:0.5px solid ${cat.color}55;font-size:11px;padding:2px 7px;border-radius:4px;line-height:1.5`; cb.textContent=cat.name; badges.appendChild(cb);
  if(showDays&&(t.scheduledSlots||[]).length){
    (t.scheduledSlots||[]).forEach(sl=>{ const db=document.createElement('span'); db.className='tbadge size-badge'; db.textContent=`${sl.day} · ${new Date(sl.week+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`; badges.appendChild(db); });
  }
  if(subtasks.length){ const sb=document.createElement('span'); sb.className='tbadge size-badge'; sb.textContent=`${stDone}/${subtasks.length} subtasks`; badges.appendChild(sb); }
  if(t.notes&&t.notes.length){ const nb=document.createElement('span'); nb.className='tbadge size-badge'; nb.textContent=`${t.notes.length} note${t.notes.length>1?'s':''}`; badges.appendChild(nb); }
  if(t.urgent&&!t.done){ const ub=document.createElement('span'); ub.className='tbadge urg-badge'; ub.textContent='Urgent'; badges.appendChild(ub); }
  if(t.recurrence&&t.recurrence.type&&t.recurrence.type!=='none'){ const rb=document.createElement('span'); rb.className='tbadge recur-badge'; rb.textContent='↻ '+recurrenceLabel(t.recurrence); badges.appendChild(rb); }
  if(t.done){ const db2=document.createElement('span'); db2.className='tbadge done-badge'; db2.textContent='Done'; badges.appendChild(db2); }
  ta.appendChild(tn); ta.appendChild(badges);

  const acts=document.createElement('div'); acts.className='task-actions'; acts.style.cssText='gap:8px';
  // Drag handle
  const dh=document.createElement('span'); dh.className='drag-handle'; dh.textContent='⠿'; dh.setAttribute('title','Drag to reorder');
  // Urgent flag — bigger
  const fb=document.createElement('button'); fb.className='icon-btn';
  fb.style.cssText='font-size:22px;opacity:'+(t.urgent?'1':'0.35')+';'+(t.urgent?'color:#E24B4A':'');
  fb.textContent='⚑'; fb.addEventListener('click',e=>{ e.stopPropagation(); toggleUrgent(t.id); });
  // Edit/modal button — bigger
  const editBtn=document.createElement('button'); editBtn.className='icon-btn';
  editBtn.style.cssText='font-size:20px;opacity:0.55';
  editBtn.textContent='✎'; editBtn.addEventListener('click',e=>{ e.stopPropagation(); openTaskModal(t.id); });
  acts.appendChild(dh); acts.appendChild(fb); acts.appendChild(editBtn);
  hdr.appendChild(ta); hdr.appendChild(acts); card.appendChild(hdr);

  // ── Expand panel ──
  const panel=document.createElement('div');
  panel.style.cssText='display:none;border-top:0.5px solid var(--border);padding:12px 14px 14px';
  let panelOpen=false;

  // Clicking the title area (name + badges) toggles the panel
  ta.style.cursor='pointer';
  ta.addEventListener('click', ()=>{
    panelOpen=!panelOpen;
    if(panelOpen){ renderPanel(); panel.style.display='block'; }
    else { panel.style.display='none'; }
  });
  function renderPanel() {
    panel.innerHTML='';
    // Always read fresh from the live task object
    const ft=tasks.find(x=>x.id===t.id); if(!ft) return;
    const fsubtasks=ft.subtasks||[];
    const fnotes=ft.notes||[];

    // Subtasks
    if(fsubtasks.length){
      const stLbl=document.createElement('div'); stLbl.style.cssText='font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px'; stLbl.textContent='Subtasks';
      panel.appendChild(stLbl);
      fsubtasks.forEach(s=>{
        const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)';
        const ck=document.createElement('input'); ck.type='checkbox'; ck.checked=!!s.done; ck.style.cssText='width:17px;height:17px;accent-color:var(--green);cursor:pointer;flex-shrink:0';
        ck.addEventListener('change',()=>{ updateSubtask(ft.id,s.id,{done:ck.checked,doneAt:ck.checked?Date.now():null}); s.done=ck.checked; nm.className='st-nm'+(s.done?' done':''); });
        const nm=document.createElement('span'); nm.className='st-nm'+(s.done?' done':''); nm.style.cssText='font-size:14px;flex:1;min-width:0;cursor:text'; nm.textContent=s.name;
        nm.addEventListener('click',()=>{
          const inp=document.createElement('input');
          inp.style.cssText='font-size:14px;flex:1;width:100%;font-family:inherit;border:none;border-bottom:1.5px solid var(--accent);background:transparent;color:var(--text);outline:none;padding:0';
          inp.value=s.name;
          nm.replaceWith(inp); inp.focus(); inp.select();
          function commit(){ const v=inp.value.trim()||s.name; s.name=v; updateSubtask(ft.id,s.id,{name:v}); inp.replaceWith(nm); nm.textContent=v; }
          inp.addEventListener('blur', commit);
          inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ inp.value=s.name; inp.blur(); } });
        });
        const dhT=(s.scheduledSlots||[]).length;
        row.appendChild(ck); row.appendChild(nm);
        if(dhT>0){ const hrs=document.createElement('span'); hrs.style.cssText='font-size:12px;color:var(--text3);white-space:nowrap'; hrs.textContent=dhT+'d'; row.appendChild(hrs); }
        panel.appendChild(row);
      });
      // Quick-add directly under last subtask
      const qaRow=document.createElement('div'); qaRow.style.cssText='display:flex;gap:8px;margin-top:8px';
      const qaInp=document.createElement('input'); qaInp.type='text'; qaInp.placeholder='Add subtask…';
      qaInp.style.cssText='flex:1;font-size:13px;font-family:inherit;height:30px;padding:0 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text)';
      const qaBtn=document.createElement('button'); qaBtn.className='btn-primary'; qaBtn.style.cssText='font-size:12px;padding:4px 10px;white-space:nowrap'; qaBtn.textContent='+ Add';
      const doAdd=()=>{ const v=qaInp.value.trim(); if(!v) return; addSubtask(ft.id,v); qaInp.value=''; renderPanel(); };
      qaBtn.addEventListener('click', doAdd);
      qaInp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
      qaRow.appendChild(qaInp); qaRow.appendChild(qaBtn);
      panel.appendChild(qaRow);
    }
    // Notes
    if(fnotes.length){
      const nLbl=document.createElement('div'); nLbl.style.cssText='font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-top:'+(fsubtasks.length?'14px':'0')+';margin-bottom:8px'; nLbl.textContent='Notes';
      panel.appendChild(nLbl);
      [...fnotes].reverse().forEach(n=>{
        const nRow=document.createElement('div'); nRow.style.cssText='margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)';
        const nMeta=document.createElement('div'); nMeta.style.cssText='font-size:11px;color:var(--text3);margin-bottom:3px';
        nMeta.textContent=new Date(n.createdAt).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

        // Note text — tap to edit inline
        const nText=document.createElement('div'); nText.style.cssText='font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text'; nText.textContent=n.text;
        nText.addEventListener('click',()=>{
          const ta=document.createElement('textarea');
          ta.style.cssText='width:100%;font-size:14px;font-family:inherit;line-height:1.5;border:none;border-bottom:1.5px solid var(--accent);background:transparent;color:var(--text);outline:none;resize:none;padding:0;overflow:hidden';
          ta.value=n.text;
          nText.replaceWith(ta);
          ta.style.height=ta.scrollHeight+'px';
          ta.focus();
          function commit(){ const v=ta.value.trim()||n.text; n.text=v; const tk=tasks.find(x=>x.id===ft.id); if(tk){ const note=tk.notes?.find(x=>x.id===n.id); if(note) note.text=v; tk.modified=Date.now(); } save(); ta.replaceWith(nText); nText.textContent=v; }
          ta.addEventListener('blur', commit);
          ta.addEventListener('keydown',e=>{ if(e.key==='Escape'){ ta.value=n.text; ta.blur(); } ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
        });

        nRow.appendChild(nMeta); nRow.appendChild(nText); panel.appendChild(nRow);
      });
    }
    if(!fsubtasks.length && !fnotes.length){
      const em=document.createElement('div');
      em.style.cssText='font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px';
      em.textContent='No subtasks or notes yet — tap to add.';
      em.addEventListener('click', e=>{ e.stopPropagation(); openTaskModal(ft.id); });
      panel.appendChild(em);
    }
  }

  card.appendChild(panel);

  // ── Bottom bar: mark done + manage slots ──
  const prog=document.createElement('div'); prog.className='task-progress';
  const ptop=document.createElement('div'); ptop.className='progress-top';
  const mb=document.createElement('button'); mb.className='log-btn'; mb.textContent=t.done?'Mark active':'Mark done'; mb.addEventListener('click',()=>markDone(t.id));
  ptop.appendChild(mb);

  if(!t.done){
    const addSlotBtn=document.createElement('button'); addSlotBtn.className='log-btn'; addSlotBtn.style.cssText='font-size:11px;padding:3px 8px'; addSlotBtn.textContent='+ Schedule';
    const calWrap=document.createElement('div'); calWrap.style.cssText='display:none;padding:10px 0 4px;border-top:0.5px solid var(--border);margin-top:8px';
    const taskCalPicker=makeCalendarPicker(t.scheduledSlots||[], slots => {
      t.scheduledSlots=slots.map(s=>({...s}));
      t.modified=Date.now(); save();
      renderSlotChips();
    });
    calWrap.appendChild(taskCalPicker.el);
    addSlotBtn.addEventListener('click',()=>{ const open=calWrap.style.display==='block'; calWrap.style.display=open?'none':'block'; addSlotBtn.textContent=open?'+ Schedule':'Close'; });
    ptop.appendChild(addSlotBtn);

    // Slot chips
    const chipRow=document.createElement('div'); chipRow.style.cssText='display:flex;flex-wrap:wrap;gap:5px;margin-top:8px';
    function renderSlotChips(){
      chipRow.innerHTML='';
      (t.scheduledSlots||[]).sort((a,b)=>a.week===b.week?DAYS.indexOf(a.day)-DAYS.indexOf(b.day):a.week.localeCompare(b.week)).forEach(sl=>{
        const chip=document.createElement('span'); chip.className='slot-chip';
        const lbl=document.createElement('span'); lbl.textContent=sl.day+' · '+new Date(sl.week+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
        const x=document.createElement('button'); x.className='slot-chip-x'; x.textContent='×';
        x.addEventListener('click',e=>{ e.stopPropagation(); removeSlot(t.id,sl.week,sl.day); taskCalPicker.setSlots(t.scheduledSlots||[]); renderSlotChips(); });
        chip.appendChild(lbl); chip.appendChild(x); chipRow.appendChild(chip);
      });
    }
    renderSlotChips();
    prog.appendChild(ptop); prog.appendChild(chipRow); prog.appendChild(calWrap);
  } else {
    prog.appendChild(ptop);
  }

  card.appendChild(prog);


  // ── Swipe-left to mark complete (touch only) ──
  const swipeWrap = document.createElement('div');
  swipeWrap.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:10px';
  const action = document.createElement('div');
  const actionColor = t.done ? 'var(--bg3)' : 'var(--green)';
  action.style.cssText = `position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:${actionColor};color:#fff;font-size:14px;font-weight:600;border-radius:var(--radius)`;
  action.textContent = t.done ? 'Reopen' : 'Done';
  card.style.marginBottom = '0';
  card.style.position = 'relative';
  card.style.willChange = 'transform';
  swipeWrap.appendChild(action);
  swipeWrap.appendChild(card);

  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;
  const THRESHOLD = 90;

  // Touch (iPhone)
  card.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; dragging = true; decided = false; horizontal = false;
    card.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    const mx = e.touches[0].clientX - startX, my = e.touches[0].clientY - startY;
    if (!decided) {
      if (Math.abs(mx) > 8 || Math.abs(my) > 8) { decided = true; horizontal = Math.abs(mx) > Math.abs(my); }
    }
    if (!horizontal) return;
    dx = Math.min(0, mx);
    card.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  card.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.2s ease';
    if (horizontal && -dx >= THRESHOLD) {
      card.style.transform = 'translateX(-100%)';
      setTimeout(() => markDone(t.id), 180);
    } else {
      card.style.transform = 'translateX(0)';
    }
  });

  // Trackpad swipe (macOS) — wheel event with deltaX
  let wheelDx = 0, wheelSettleTimer = null;
  card.addEventListener('wheel', e => {
    // Only act on predominantly horizontal scroll
    if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
    e.preventDefault();
    wheelDx = Math.min(0, wheelDx + e.deltaX * -1);
    card.style.transition = 'none';
    card.style.transform = `translateX(${wheelDx}px)`;
    clearTimeout(wheelSettleTimer);
    wheelSettleTimer = setTimeout(() => {
      card.style.transition = 'transform 0.25s ease';
      if (-wheelDx >= THRESHOLD) {
        card.style.transform = 'translateX(-100%)';
        setTimeout(() => markDone(t.id), 220);
      } else {
        card.style.transform = 'translateX(0)';
      }
      wheelDx = 0;
    }, 120);
  }, { passive: false });

  return swipeWrap;
}

// ─── ADD FORM ─────────────────────────────────────────────────────────────────
function renderAddForm() {
  const f=document.createElement('div'); f.className='add-form';
  const r1=document.createElement('div'); r1.className='af-row';
  const inp=document.createElement('input'); inp.className='af-input'; inp.id='t-name'; inp.type='text'; inp.placeholder='Task name...';
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });
  r1.appendChild(inp);
  const r2=document.createElement('div'); r2.className='af-row';
  const catEl=makeCS(CATS.map(c=>({value:c.id,label:c.name,color:c.color})),selCat,val=>{ selCat=val; });
  r2.appendChild(catEl);
  const ul=document.createElement('label'); ul.className='urg-label';
  const uc=document.createElement('input'); uc.type='checkbox'; uc.id='t-urgent'; uc.addEventListener('change',e=>{ addUrgent=e.target.checked; });
  ul.appendChild(uc); ul.appendChild(document.createTextNode('Urgent')); r2.appendChild(ul);
  const btn=document.createElement('button'); btn.className='btn-primary'; btn.textContent='Add'; btn.addEventListener('click',addTask); r2.appendChild(btn);

  // Calendar slot picker — hidden behind toggle button
  const r3=document.createElement('div'); r3.style.marginTop='8px';

  const schedBtn=document.createElement('button'); schedBtn.className='nb';
  schedBtn.style.cssText='font-size:12px;padding:5px 12px';
  schedBtn.textContent='📅 Schedule days';

  const calWrap=document.createElement('div'); calWrap.style.cssText='display:none;margin-top:8px';
  const calPicker=makeCalendarPicker(selSlots, slots => {
    selSlots=slots.map(s=>({...s}));
    renderSelChips();
  });
  calWrap.appendChild(calPicker.el);

  // ── Recurrence fields (below calendar) ──
  const recurWrap=document.createElement('div'); recurWrap.style.cssText='margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)';
  const recurLbl=document.createElement('div'); recurLbl.style.cssText='font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px'; recurLbl.textContent='Repeat';
  recurWrap.appendChild(recurLbl);

  let recurState={type:'none',dayOfWeek:'Mon',weekOfMonth:1,dayOfMonth:1,startDate:todayStr(),endDate:''};

  const rTypeRow=document.createElement('div'); rTypeRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:center';
  const rTypeSel=document.createElement('select'); rTypeSel.className='af-select'; rTypeSel.style.cssText='flex:1;height:34px;font-size:13px';
  [{value:'none',label:'Does not repeat'},{value:'weekly',label:'Weekly'},{value:'fortnightly',label:'Fortnightly'},{value:'monthly-date',label:'Monthly by date'},{value:'monthly-day',label:'Monthly by weekday'}].forEach(o=>{
    const opt=document.createElement('option'); opt.value=o.value; opt.textContent=o.label; rTypeSel.appendChild(opt);
  });
  rTypeRow.appendChild(rTypeSel); recurWrap.appendChild(rTypeRow);

  const rDynamicFields=document.createElement('div');
  recurWrap.appendChild(rDynamicFields);

  function buildAddRecFields(){
    rDynamicFields.innerHTML='';
    selRecurrence = recurState.type==='none' ? null : {...recurState};
    if(recurState.type==='none') return;

    const fRow=(lbl,el)=>{ const r=document.createElement('div'); r.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:6px'; const l=document.createElement('span'); l.style.cssText='font-size:12px;color:var(--text2);min-width:90px'; l.textContent=lbl; r.appendChild(l); r.appendChild(el); rDynamicFields.appendChild(r); };

    if(['weekly','fortnightly','monthly-day'].includes(recurState.type)){
      const sel=document.createElement('select'); sel.className='af-select'; sel.style.cssText='flex:1;height:32px;font-size:13px';
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; if(d===recurState.dayOfWeek) o.selected=true; sel.appendChild(o); });
      sel.addEventListener('change',()=>{ recurState.dayOfWeek=sel.value; selRecurrence={...recurState}; });
      fRow('Day',sel);
    }
    if(recurState.type==='monthly-day'){
      const sel=document.createElement('select'); sel.className='af-select'; sel.style.cssText='flex:1;height:32px;font-size:13px';
      [{value:1,label:'1st'},{value:2,label:'2nd'},{value:3,label:'3rd'},{value:4,label:'4th'},{value:-1,label:'Last'}].forEach(o=>{ const opt=document.createElement('option'); opt.value=o.value; opt.textContent=o.label; if(o.value==recurState.weekOfMonth) opt.selected=true; sel.appendChild(opt); });
      sel.addEventListener('change',()=>{ recurState.weekOfMonth=parseInt(sel.value); selRecurrence={...recurState}; });
      fRow('Week',sel);
    }
    if(recurState.type==='monthly-date'){
      const inp=document.createElement('input'); inp.type='number'; inp.min='1'; inp.max='31'; inp.value=recurState.dayOfMonth; inp.className='af-select'; inp.style.cssText='width:70px;height:32px;font-size:13px';
      inp.addEventListener('change',()=>{ recurState.dayOfMonth=parseInt(inp.value)||1; selRecurrence={...recurState}; });
      fRow('Day of month',inp);
    }

    // Start date — defaults to earliest selected slot date or today
    const earliestSlot=selSlots.length ? selSlots.slice().sort((a,b)=>a.week.localeCompare(b.week))[0] : null;
    if(earliestSlot && !recurState._startDateSet) { recurState.startDate=earliestSlot.week; } // use week Monday as proxy
    const sInp=document.createElement('input'); sInp.type='date'; sInp.className='af-select'; sInp.style.cssText='flex:1;height:32px;font-size:13px'; sInp.value=recurState.startDate;
    sInp.addEventListener('change',()=>{ recurState.startDate=sInp.value; recurState._startDateSet=true; selRecurrence={...recurState}; });
    fRow('Start date',sInp);

    // End date
    const eInp=document.createElement('input'); eInp.type='date'; eInp.className='af-select'; eInp.style.cssText='flex:1;height:32px;font-size:13px'; eInp.value=recurState.endDate; eInp.placeholder='Optional';
    eInp.addEventListener('change',()=>{ recurState.endDate=eInp.value; selRecurrence={...recurState}; });
    fRow('End date',eInp);
  }

  rTypeSel.addEventListener('change',()=>{ recurState.type=rTypeSel.value; buildAddRecFields(); });
  buildAddRecFields();
  calWrap.appendChild(recurWrap);

  schedBtn.addEventListener('click', e=>{ e.stopPropagation(); const open=calWrap.style.display==='block'; calWrap.style.display=open?'none':'block'; renderSelChips(); });

  r3.appendChild(schedBtn);
  r3.appendChild(calWrap);

  const selChipRow=document.createElement('div'); selChipRow.style.cssText='display:flex;flex-wrap:wrap;gap:5px;margin-top:6px';
  function renderSelChips(){
    selChipRow.innerHTML='';
    selSlots.sort((a,b)=>a.week===b.week?DAYS.indexOf(a.day)-DAYS.indexOf(b.day):a.week.localeCompare(b.week)).forEach(sl=>{
      const chip=document.createElement('span'); chip.className='slot-chip';
      const lbl=document.createElement('span'); lbl.textContent=sl.day+' · '+new Date(sl.week+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
      const x=document.createElement('button'); x.className='slot-chip-x'; x.textContent='×';
      x.addEventListener('click',e=>{ e.stopPropagation(); selSlots=selSlots.filter(s=>!(s.week===sl.week&&s.day===sl.day)); calPicker.setSlots(selSlots); renderSelChips(); });
      chip.appendChild(lbl); chip.appendChild(x); selChipRow.appendChild(chip);
    });
    // Update button label to show count if days selected
    schedBtn.textContent = calWrap.style.display==='block'
      ? '📅 Close'
      : selSlots.length ? `📅 ${selSlots.length} day${selSlots.length>1?'s':''} selected` : '📅 Schedule days';
  }
  r3.appendChild(selChipRow);
  f.appendChild(r1); f.appendChild(r2); f.appendChild(r3);
  return f;
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function renderSearchBar() {
  const wrap=document.createElement('div'); wrap.className='search-wrap';
  const inp=document.createElement('input'); inp.className='search-inp'; inp.type='search'; inp.placeholder='Search tasks…'; inp.value=searchQuery;
  const clr=document.createElement('button'); clr.className='search-clear'+(searchQuery?' visible':''); clr.textContent='×'; clr.setAttribute('aria-label','Clear search');
  inp.addEventListener('input',()=>{ searchQuery=inp.value; clr.className='search-clear'+(searchQuery?' visible':''); render(); });
  clr.addEventListener('click',e=>{ e.stopPropagation(); searchQuery=''; inp.value=''; clr.className='search-clear'; render(); });
  wrap.appendChild(inp); wrap.appendChild(clr);
  return wrap;
}

function renderSearchResults(container, query) {
  const q=query.toLowerCase().trim();
  const matched=tasks.filter(t=>!t.deleted&&!t.done&&t.name.toLowerCase().includes(q));
  if(!matched.length){
    const em=document.createElement('div'); em.className='empty-msg'; em.textContent=`No tasks matching "${query}"`; container.appendChild(em); return;
  }
  matched.forEach(t=>{
    const cat=CATS.find(c=>c.id===t.cat)||CATS[0];
    const w=document.createElement('div'); w.style.cssText='margin-bottom:6px';
    const tc=taskCard(t,true); tc.style.borderRadius='var(--radius)';
    // Highlight match in name
    const nameEl=tc.querySelector('.task-name');
    if(nameEl){
      const idx=t.name.toLowerCase().indexOf(q);
      if(idx>=0){
        nameEl.innerHTML='';
        const before=document.createTextNode(t.name.slice(0,idx));
        const match=document.createElement('mark'); match.style.cssText='background:#FFE08A;border-radius:2px;padding:0 1px'; match.textContent=t.name.slice(idx,idx+q.length);
        const after=document.createTextNode(t.name.slice(idx+q.length));
        nameEl.appendChild(before); nameEl.appendChild(match); nameEl.appendChild(after);
      }
    }
    w.appendChild(tc); container.appendChild(w);
  });
}

// ─── DRAG TO REORDER ──────────────────────────────────────────────────────────
function makeDraggable(container, catId, taskEls) {
  if(taskEls.length<2) return;
  let dragIdx=null, overIdx=null;

  // Create and insert drop indicators after each item
  const indicators=taskEls.map(()=>{
    const ind=document.createElement('div'); ind.className='drop-indicator'; ind.style.opacity='0';
    return ind;
  });

  function showIndicator(idx){
    indicators.forEach((ind,ii)=>ind.style.opacity=idx===ii?'1':'0');
  }
  function hideIndicators(){ indicators.forEach(ind=>ind.style.opacity='0'); }

  function getOverIdx(clientY){
    for(let j=0;j<taskEls.length;j++){
      const rect=taskEls[j].el.getBoundingClientRect();
      if(clientY<rect.top+rect.height/2) return j;
    }
    return taskEls.length-1;
  }

  function commit(){
    hideIndicators();
    taskEls.forEach(({el})=>el.style.opacity='');
    if(dragIdx!==null&&overIdx!==null&&overIdx!==dragIdx){
      reorderTask(catId,dragIdx,overIdx);
    }
    dragIdx=null; overIdx=null;
  }

  taskEls.forEach(({el},i)=>{
    // Insert indicator before each item
    el.parentNode.insertBefore(indicators[i], el);

    const handle=el.querySelector('.drag-handle');
    if(!handle) return;

    // ── Mouse drag ──
    handle.addEventListener('mousedown',e=>{
      if(e.button!==0) return;
      e.preventDefault(); e.stopPropagation();
      dragIdx=i;
      el.style.opacity='0.4';

      const onMove=e2=>{
        overIdx=getOverIdx(e2.clientY);
        showIndicator(overIdx);
      };
      const onUp=()=>{
        window.removeEventListener('mousemove',onMove);
        window.removeEventListener('mouseup',onUp);
        commit();
      };
      window.addEventListener('mousemove',onMove);
      window.addEventListener('mouseup',onUp);
    });

    // ── Touch drag ──
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      dragIdx=i;
      el.style.opacity='0.4';
    },{passive:true});

    handle.addEventListener('touchmove',e=>{
      if(dragIdx===null) return;
      e.preventDefault();
      overIdx=getOverIdx(e.touches[0].clientY);
      showIndicator(overIdx);
    },{passive:false});

    handle.addEventListener('touchend',()=>{
      commit();
    });
  });
}
function render() {
  document.getElementById('wlabel').textContent = getWeekLabel(weekOffset);
  const active=tasks.filter(t=>!t.done&&!t.deleted), done=tasks.filter(t=>t.done&&!t.deleted);
  const urgent=active.filter(t=>t.urgent).length;
  const wStart=getMonday(weekOffset).getTime(), wEnd=wStart+7*864e5;
  const doneThisWeek=done.filter(t=>t.doneAt&&t.doneAt>=wStart&&t.doneAt<wEnd).length;
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-n">${active.length}</div><div class="stat-l">Active</div></div><div class="stat"><div class="stat-n" style="color:#1D9E75">${doneThisWeek}</div><div class="stat-l">Done this week</div></div><div class="stat"><div class="stat-n" style="color:#E24B4A">${urgent}</div><div class="stat-l">Urgent</div></div>`;

  const main=document.getElementById('main'); main.innerHTML='';

  if(!isAuthed()) maybeSilentRefresh();

  renderAuthArea();
  updateBadge();
  renderDeadlines(main);

  if(view==='day'){
    // Rolling 7-day window starting from today
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    const windowDays=[]; // [{date, dateStr, week, dayName, label}]
    const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(let i=0;i<7;i++){
      const d=new Date(todayD); d.setDate(todayD.getDate()+i);
      const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const dow=d.getDay(); // 0=Sun
      const diff=dow===0?-6:1-dow;
      const mon=new Date(d); mon.setDate(d.getDate()+diff);
      const week=`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
      const dayName=DAY_NAMES[dow];
      const label=i===0?'Today':DAY_NAMES[dow].slice(0,3)+' '+d.getDate();
      windowDays.push({date:d,dateStr,week,dayName,label});
    }

    // Ensure all relevant weeks are fetched for calendar
    const weeksNeeded=[...new Set(windowDays.map(x=>x.week))];
    weeksNeeded.forEach(w=>{ if(isAuthed()&&!calCache[w]&&!calFetching.has(w)) fetchCalendarWeek(w); });
    const calLoading=weeksNeeded.some(w=>calFetching.has(w));
    const calCached=weeksNeeded.every(w=>!!calCache[w]);

    // Ensure selDay is within the window; reset to today if not
    if(!windowDays.find(x=>x.dateStr===selDay)) selDay=windowDays[0].dateStr;
    const selWindow=windowDays.find(x=>x.dateStr===selDay)||windowDays[0];

    // Today banner — urgent, recurring, deadline items
    renderTodayBanner(main);

    const lbl=document.createElement('div'); lbl.className='section-label';
    const lblText=document.createElement('span'); lblText.textContent='Next 7 days';
    lbl.appendChild(lblText);
    if(calLoading&&!calCached){
      const spin=document.createElement('span'); spin.style.cssText='font-size:11px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0;animation:pulse 1.2s ease-in-out infinite'; spin.textContent='Syncing…'; lbl.appendChild(spin);
    } else if(isAuthed()){
      const rfbtn=document.createElement('button'); rfbtn.className='nb'; rfbtn.style.cssText='font-size:11px;padding:2px 8px'; rfbtn.textContent='↻ Refresh';
      rfbtn.addEventListener('click',()=>{ weeksNeeded.forEach(w=>{ delete calCache[w]; calFetching.delete(w); try{ const s=JSON.parse(localStorage.getItem('calCache')||'{}'); delete s[w]; localStorage.setItem('calCache',JSON.stringify(s)); }catch(e){} }); render(); });
      lbl.appendChild(rfbtn);
    }
    main.appendChild(lbl);

    // Day tabs row
    const rowLabels=document.createElement('div'); rowLabels.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:2px';
    rowLabels.appendChild(document.createElement('div'));
    windowDays.forEach(wd=>{
      const tab=document.createElement('button'); tab.className='day-tab'+(wd.dateStr===selDay?' active':'');
      const dayName=wd.label==='Today'?'Today':wd.date.toLocaleDateString('en-AU',{weekday:'short'});
      const dateStr=`${String(wd.date.getDate()).padStart(2,'0')}/${String(wd.date.getMonth()+1).padStart(2,'0')}`;
      tab.innerHTML=`<span style="display:block">${dayName}</span><span style="display:block;font-size:10px;opacity:0.75">${dateStr}</span>`;
      tab.style.lineHeight='1.4';
      tab.addEventListener('click',()=>{ selDay=wd.dateStr; render(); });
      rowLabels.appendChild(tab);
    });
    main.appendChild(rowLabels);

    // Tasks count row
    const tasksRow=document.createElement('div'); tasksRow.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:3px';
    const tRowLbl=document.createElement('div'); tRowLbl.style.cssText='font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;line-height:1.2'; tRowLbl.textContent='Tasks';
    tasksRow.appendChild(tRowLbl);
    let totalTaskPlanned=0;
    windowDays.forEach(wd=>{
      const slotCount=tasks.filter(t=>!t.done&&!t.deleted&&(t.scheduledSlots||[]).some(s=>s.week===wd.week&&s.day===wd.dayName)).length;
      const recurCount=tasks.filter(t=>!t.done&&!t.deleted&&occursOn(t,wd.dateStr)).length;
      const taskCount=slotCount+recurCount;
      totalTaskPlanned+=taskCount;
      const col=hoursColor(taskCount);
      const hbox=document.createElement('div'); hbox.className=`hbox ${col}`;
      hbox.innerHTML=`<div class="hbox-n">${taskCount>0?taskCount:'—'}</div>`;
      tasksRow.appendChild(hbox);
    });
    main.appendChild(tasksRow);

    // Calendar row
    const calRow=document.createElement('div'); calRow.style.cssText='display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px';
    const cRowLbl=document.createElement('div'); cRowLbl.style.cssText='font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;line-height:1.2'; cRowLbl.textContent='Cal';
    calRow.appendChild(cRowLbl);
    let totalCal=0;
    windowDays.forEach(wd=>{
      const wCalData=calCache[wd.week];
      const calHours=wCalData ? (wCalData.calH[wd.dayName]||0) : 0;
      totalCal+=calHours;
      const col=hoursColor(calHours);
      const hbox=document.createElement('div'); hbox.className=`hbox ${col}`;
      hbox.innerHTML=`<div class="hbox-n">${calHours>0?calHours.toFixed(1)+'h':'—'}</div>`;
      calRow.appendChild(hbox);
    });
    main.appendChild(calRow);

    const ws=document.createElement('div'); ws.className='week-summary';
    if(!isAuthed()) ws.textContent=`${totalTaskPlanned} task${totalTaskPlanned!==1?'s':''} in next 7 days`;
    else if(calLoading&&!calCached) ws.textContent='Loading calendar…';
    else ws.textContent=`${totalTaskPlanned} task${totalTaskPlanned!==1?'s':''} · ${totalCal.toFixed(1)}h calendar`;
    main.appendChild(ws);

    // Calendar events for selected day
    const wCalData=calCache[selWindow.week];
    const calEvs=wCalData ? (wCalData.calData[selWindow.dayName]||[]) : [];
    if(calEvs.length){
      const cl=document.createElement('div'); cl.className='section-label'; cl.textContent=`Calendar — ${selWindow.label}`; main.appendChild(cl);
      const cc=document.createElement('div'); cc.className='cal-card';
      calEvs.forEach(ev=>{ const r=document.createElement('div'); r.className='cal-ev'; r.innerHTML=`<div class="cal-dot"></div><span class="cal-time">${ev.time}</span><span class="cal-title">${ev.title}</span>`; cc.appendChild(r); });
      main.appendChild(cc);
    } else if(isAuthed()&&calLoading&&!calCached){
      const cl=document.createElement('div'); cl.className='section-label'; cl.textContent=`Calendar — ${selWindow.label}`; main.appendChild(cl);
      const ph=document.createElement('div'); ph.className='cal-card'; ph.innerHTML=`<div class="cal-ev" style="justify-content:center;color:var(--text3);font-size:13px;font-style:italic">Loading events…</div>`; main.appendChild(ph);
    }

    const slottedTasks=tasks.filter(t=>!t.done&&!t.deleted&&(t.scheduledSlots||[]).some(s=>s.week===selWindow.week&&s.day===selWindow.dayName));
    const recurringTasks=tasks.filter(t=>!t.done&&!t.deleted&&occursOn(t,selWindow.dateStr)&&!(t.scheduledSlots||[]).some(s=>s.week===selWindow.week&&s.day===selWindow.dayName));
    const dayTasks=[...slottedTasks,...recurringTasks].sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
    const tl=document.createElement('div'); tl.className='section-label'; tl.textContent=`Tasks — ${selWindow.label}`; main.appendChild(tl);
    if(!dayTasks.length){ const em=document.createElement('div'); em.className='empty-msg'; em.textContent='No tasks planned for this day'; main.appendChild(em); }
    else{
      dayTasks.forEach(t=>{
        const wrap=document.createElement('div'); wrap.style.cssText='position:relative';
        wrap.appendChild(taskCard(t,false));
        // Skip button for recurring tasks
        if(occursOn(t,selWindow.dateStr)){
          const skipBtn=document.createElement('button'); skipBtn.className='log-btn';
          skipBtn.style.cssText='font-size:11px;padding:3px 8px;position:absolute;top:12px;right:52px;z-index:2';
          skipBtn.textContent='Skip date';
          skipBtn.addEventListener('click',e=>{ e.stopPropagation(); skipOccurrence(t.id,selWindow.dateStr); });
          wrap.appendChild(skipBtn);
        }
        main.appendChild(wrap);
      });
    }
    main.appendChild(renderAddForm());

  } else if(view==='tasks') {
    main.appendChild(renderSearchBar());
    main.appendChild(renderAddForm());

    if(searchQuery.trim()){
      const tl=document.createElement('div'); tl.className='section-label'; tl.textContent=`Results for "${searchQuery}"`; main.appendChild(tl);
      renderSearchResults(main, searchQuery);
    } else {
      const tl=document.createElement('div'); tl.className='section-label'; tl.textContent='All tasks'; main.appendChild(tl);

      // Recurring tasks block (collapsed by default)
      const recurringAll=tasks.filter(t=>!t.deleted&&!t.done&&t.recurrence&&t.recurrence.type&&t.recurrence.type!=='none');
      if(recurringAll.length){
        const isRecurOpen=collapsed['__recurring']===false;
        const rBlock=document.createElement('div'); rBlock.className='recur-block';
        const rHdr=document.createElement('div'); rHdr.className='recur-hdr'+(isRecurOpen?' open':'');
        rHdr.innerHTML=`<span style="font-size:16px">↻</span><span class="recur-hdr-title">Recurring tasks</span><span class="recur-hdr-meta">${recurringAll.length} task${recurringAll.length>1?'s':''}</span><span style="font-size:14px;color:var(--text3)">${isRecurOpen?'▴':'▾'}</span>`;
        rHdr.addEventListener('click',()=>{ collapsed['__recurring']=isRecurOpen?undefined:false; save(); render(); });
        rBlock.appendChild(rHdr);
        if(isRecurOpen){
          recurringAll.forEach(t=>{
            const cat=CATS.find(c=>c.id===t.cat)||CATS[0];
            const row=document.createElement('div'); row.style.cssText='display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-top:0.5px solid var(--border)';
            const dot=document.createElement('div'); dot.style.cssText=`width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0;margin-top:5px`;
            const info=document.createElement('div'); info.style.cssText='flex:1;min-width:0';
            const nm=document.createElement('div'); nm.style.cssText='font-size:14px;font-weight:500'; nm.textContent=t.name;
            const rl=document.createElement('div'); rl.className='recur-rule-lbl'; rl.textContent='↻ '+recurrenceLabel(t.recurrence);
            info.appendChild(nm); info.appendChild(rl);
            const editBtn=document.createElement('button'); editBtn.className='icon-btn'; editBtn.style.cssText='font-size:20px;opacity:0.55'; editBtn.textContent='✎';
            editBtn.addEventListener('click',e=>{ e.stopPropagation(); openTaskModal(t.id); });
            row.appendChild(dot); row.appendChild(info); row.appendChild(editBtn);
            rBlock.appendChild(row);
          });
        }
        main.appendChild(rBlock);
      }

      CATS.forEach(c=>{
        const ct=sortedByCat(tasks.filter(t=>t.cat===c.id&&!t.deleted&&!t.done&&!(t.recurrence&&t.recurrence.type&&t.recurrence.type!=='none')));
        if(!ct.length) return;
        const isOpen=!collapsed[c.id];
        const block=document.createElement('div'); block.className='cat-block';
        block.style.borderLeft=`3px solid ${c.color}`;
        const hdr=document.createElement('div'); hdr.className='cat-hdr';
        hdr.style.background=`${c.color}1A`;
        hdr.innerHTML=`<div class="cdot" style="background:${c.color}"></div><span class="cat-name-lbl">${c.name}</span><span class="cat-meta-lbl">${ct.length} active</span><span style="font-size:14px;color:var(--text3)">${isOpen?'▴':'▾'}</span>`;
        hdr.addEventListener('click',()=>{ collapsed[c.id]=!collapsed[c.id]; save(); render(); });
        block.appendChild(hdr);
        if(isOpen){
          const taskEls=[];
          ct.forEach(t=>{
            const w=document.createElement('div'); w.style.borderTop='0.5px solid var(--border)';
            const tc=taskCard(t,true); tc.style.marginBottom='0'; tc.style.borderRadius='0';
            w.appendChild(tc); block.appendChild(w);
            taskEls.push({el:w,tid:t.id});
          });
          makeDraggable(block, c.id, taskEls);
        }
        main.appendChild(block);
      });
    }
  } else {
    // Archive view
    main.appendChild(renderSearchBar());
    const tl=document.createElement('div'); tl.className='section-label'; tl.style.marginTop='0'; tl.textContent='Completed tasks'; main.appendChild(tl);
    renderArchive(main, searchQuery);
  }
}

document.getElementById('prev').addEventListener('click',()=>{ weekOffset--; render(); });
document.getElementById('next').addEventListener('click',()=>{ weekOffset++; render(); });
document.getElementById('todaybtn').addEventListener('click',()=>{ weekOffset=0; render(); });
document.getElementById('tog-day').addEventListener('click',()=>setView('day'));
document.getElementById('tog-tasks').addEventListener('click',()=>setView('tasks'));

document.addEventListener('click', () => {
  document.querySelectorAll('.cs-dropdown.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.cs-trigger.open').forEach(t => t.classList.remove('open'));
});

// Request persistent storage so the browser is less likely to evict your data
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(()=>{});
}

// Register service worker for PWA offline support
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:', e)); });
}

handleOAuthRedirect(); // parse token from redirect hash before anything else
loadToken();
loadCalCache();
load();
migrateTasks();
renderAuthArea();
render();
waitForGis();

// Pull-and-merge when the app regains focus (e.g. switching back after editing
// on another device). Throttled so rapid toggles don't hammer Drive.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isAuthed() && Date.now() - lastSyncAt > 5000) syncNow();
});
window.addEventListener('focus', () => {
  if (isAuthed() && Date.now() - lastSyncAt > 5000) syncNow();
});

// Initial pull-merge-push on boot if already connected.
if (isAuthed()) syncNow();
